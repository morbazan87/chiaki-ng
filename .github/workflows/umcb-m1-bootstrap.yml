# One-shot M1 branch setup. The job removes this workflow after committing
# ordinary, reviewable source files. It NEVER changes umcb/foundation.
name: UMCB M1 One-Time Recorder Setup
on:
  push:
    branches:
      - umcb/m1-frame-capture
    paths:
      - .github/workflows/umcb-m1-bootstrap.yml
permissions:
  contents: write
jobs:
  install-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Check out M1 branch only
        uses: actions/checkout@v4
        with:
          ref: umcb/m1-frame-capture
          persist-credentials: true
      - name: Commit normal M1 source code, then remove this bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git branch --show-current)" != "umcb/m1-frame-capture" ]; then echo "Wrong branch; refusing to modify"; exit 1; fi
          if [ "$(git rev-parse HEAD)" = "16e6045163743113827645adfda506a243e819d7" ]; then echo "Unexpected: M1 bootstrap commit missing"; exit 1; fi
          mkdir -p gui/include gui/src
          cat > gui/include/umcbvideorecorder.h <<'UMCB_M1_HEADER'
          // SPDX-License-Identifier: LicenseRef-AGPL-3.0-only-OpenSSL
          // UMCB M1: video-only, PS4-encoded-sample recorder. No desktop capture or PS4 input.
          #pragma once
          
          #include <QByteArray>
          #include <QString>
          #include <atomic>
          #include <condition_variable>
          #include <cstddef>
          #include <cstdint>
          #include <deque>
          #include <mutex>
          #include <thread>
          
          class UMCBVideoRecorder final
          {
          public:
              UMCBVideoRecorder(unsigned width, unsigned height, unsigned fps);
              ~UMCBVideoRecorder();
              QString start(int seconds);
              void stop();
              void feed(const uint8_t *data, size_t size);
              bool active() const { return active_.load(); }
              QString status() const;
          
          private:
              struct VideoSample {
                  QByteArray bytes;
                  int64_t capture_us = 0;
                  bool idr = false;
              };
              static int64_t monotonicUs();
              static bool containsNalType(const uint8_t *data, size_t size, unsigned type);
              void writeRecording(QByteArray header, QString output_path);
          
              const unsigned width_;
              const unsigned height_;
              const unsigned fps_;
              mutable std::mutex mutex_;
              std::condition_variable event_;
              std::deque<VideoSample> queue_;
              QByteArray header_;
              QString output_path_;
              QString status_ = QStringLiteral("Idle");
              size_t queued_bytes_ = 0;
              bool stop_requested_ = false;
              int duration_seconds_ = 120;
              int64_t start_us_ = 0;
              std::atomic<bool> active_{false};
              std::thread worker_;
          };
          UMCB_M1_HEADER
          cat > gui/src/umcbvideorecorder.cpp <<'UMCB_M1_SOURCE'
          // SPDX-License-Identifier: LicenseRef-AGPL-3.0-only-OpenSSL
          #include "umcbvideorecorder.h"
          
          #include <QDateTime>
          #include <QDir>
          #include <QFile>
          #include <QStandardPaths>
          
          #include <algorithm>
          #include <chrono>
          #include <cstring>
          #include <limits>
          
          extern "C" {
          #include <libavformat/avformat.h>
          #include <libavcodec/avcodec.h>
          #include <libavutil/mem.h>
          }
          
          namespace {
          constexpr int64_t kMaxFileBytes = 300000000; // 300 decimal MB
          constexpr size_t kMaxQueuedBytes = 16 * 1024 * 1024;
          constexpr int kMaxQueueSamples = 400;
          }
          
          UMCBVideoRecorder::UMCBVideoRecorder(unsigned width, unsigned height, unsigned fps)
              : width_(width), height_(height), fps_(fps ? fps : 60)
          {
          }
          
          UMCBVideoRecorder::~UMCBVideoRecorder()
          {
              stop();
          }
          
          int64_t UMCBVideoRecorder::monotonicUs()
          {
              return std::chrono::duration_cast<std::chrono::microseconds>(
                         std::chrono::steady_clock::now().time_since_epoch()).count();
          }
          
          bool UMCBVideoRecorder::containsNalType(const uint8_t *p, size_t size, unsigned type)
          {
              if (!p || size < 5)
                  return false;
              for (size_t i = 0; i + 4 < size; ++i) {
                  if (p[i] != 0 || p[i + 1] != 0)
                      continue;
                  const bool three = p[i + 2] == 1;
                  const bool four = p[i + 2] == 0 && p[i + 3] == 1;
                  if (!three && !four)
                      continue;
                  const size_t nal = i + (four ? 4 : 3);
                  if (nal < size && (p[nal] & 0x1fu) == type)
                      return true;
              }
              return false;
          }
          
          QString UMCBVideoRecorder::start(int seconds)
          {
              if (seconds != 120 && seconds != 180)
                  return QStringLiteral("ERROR: Choose 120 or 180 seconds");
              if (active_.load())
                  return QStringLiteral("ERROR: Recording already active");
              // Reap an earlier auto-stopped recording before opening another file.
              stop();
          
              QString movies = QStandardPaths::writableLocation(QStandardPaths::MoviesLocation);
              if (movies.isEmpty())
                  movies = QDir::homePath();
              QDir folder(movies);
              if (!folder.mkpath(QStringLiteral("UMCB Recordings")))
                  return QStringLiteral("ERROR: Could not create recording directory");
              folder.cd(QStringLiteral("UMCB Recordings"));
              const QString basename = QStringLiteral("UMCB_Minecraft_FullSequence_") +
                  QDateTime::currentDateTime().toString(QStringLiteral("yyyy-MM-dd_HHmmss_zzz")) +
                  QStringLiteral(".mp4");
              const QString file_path = folder.filePath(basename);
          
              QByteArray header;
              {
                  std::lock_guard<std::mutex> lock(mutex_);
                  header = header_;
                  if (header.isEmpty())
                      return QStringLiteral("ERROR: PS4 H.264 header not received yet; reconnect video and retry");
                  queue_.clear();
                  queued_bytes_ = 0;
                  stop_requested_ = false;
                  duration_seconds_ = seconds;
                  start_us_ = monotonicUs();
                  output_path_ = file_path;
                  status_ = QStringLiteral("Recording: ") + file_path;
                  active_.store(true);
              }
              worker_ = std::thread(&UMCBVideoRecorder::writeRecording, this, header, file_path);
              return file_path;
          }
          
          void UMCBVideoRecorder::stop()
          {
              active_.store(false);
              {
                  std::lock_guard<std::mutex> lock(mutex_);
                  stop_requested_ = true;
              }
              event_.notify_one();
              if (worker_.joinable())
                  worker_.join();
          }
          
          QString UMCBVideoRecorder::status() const
          {
              std::lock_guard<std::mutex> lock(mutex_);
              return status_;
          }
          
          void UMCBVideoRecorder::feed(const uint8_t *data, size_t size)
          {
              if (!data || !size || size > static_cast<size_t>(std::numeric_limits<int>::max()))
                  return;
          
              // Chiaki sends the H.264 SPS/PPS header as a separate sample upon profile setup.
              // Keep that tiny header even before the user starts recording.
              if (containsNalType(data, size, 7)) {
                  std::lock_guard<std::mutex> lock(mutex_);
                  header_ = QByteArray(reinterpret_cast<const char *>(data), static_cast<int>(size));
                  return;
              }
              if (!active_.load())
                  return;
          
              const int64_t now = monotonicUs();
              bool notify = false;
              {
                  std::lock_guard<std::mutex> lock(mutex_);
                  if (!active_.load())
                      return;
                  if (now - start_us_ >= static_cast<int64_t>(duration_seconds_) * 1000000) {
                      active_.store(false);
                      stop_requested_ = true;
                      notify = true;
                  } else if (queued_bytes_ + size > kMaxQueuedBytes ||
                             queue_.size() >= kMaxQueueSamples) {
                      active_.store(false);
                      stop_requested_ = true;
                      status_ = QStringLiteral("ERROR: Recording queue overloaded; check saved clip");
                      notify = true;
                  } else {
                      VideoSample sample;
                      sample.bytes = QByteArray(reinterpret_cast<const char *>(data), static_cast<int>(size));
                      sample.capture_us = now;
                      sample.idr = containsNalType(data, size, 5);
                      queued_bytes_ += size;
                      queue_.push_back(std::move(sample));
                      notify = true;
                  }
              }
              if (notify)
                  event_.notify_one();
          }
          
          void UMCBVideoRecorder::writeRecording(QByteArray header, QString output_path)
          {
              AVFormatContext *fmt = nullptr;
              AVPacket *packet = nullptr;
              bool header_written = false;
              bool failed = false;
              bool truncated = false;
              bool received_idr = false;
              int64_t first_us = -1;
              int64_t last_pts = -1;
              int written_frames = 0;
              QString error;
          
              do {
                  const QByteArray path_utf8 = output_path.toUtf8();
                  if (avformat_alloc_output_context2(&fmt, nullptr, "mp4", path_utf8.constData()) < 0 || !fmt) {
                      error = QStringLiteral("FFmpeg could not initialise MP4 writer");
                      failed = true;
                      break;
                  }
                  AVStream *stream = avformat_new_stream(fmt, nullptr);
                  if (!stream) {
                      error = QStringLiteral("FFmpeg could not create video stream");
                      failed = true;
                      break;
                  }
                  stream->time_base = AVRational{1, 90000};
                  stream->avg_frame_rate = AVRational{static_cast<int>(fps_), 1};
                  AVCodecParameters *par = stream->codecpar;
                  par->codec_type = AVMEDIA_TYPE_VIDEO;
                  par->codec_id = AV_CODEC_ID_H264;
                  par->width = static_cast<int>(width_);
                  par->height = static_cast<int>(height_);
                  par->extradata = static_cast<uint8_t *>(av_mallocz(header.size() + AV_INPUT_BUFFER_PADDING_SIZE));
                  if (!par->extradata) {
                      error = QStringLiteral("FFmpeg ran out of memory for H.264 header");
                      failed = true;
                      break;
                  }
                  memcpy(par->extradata, header.constData(), static_cast<size_t>(header.size()));
                  par->extradata_size = static_cast<int>(header.size());
          
                  if (!(fmt->oformat->flags & AVFMT_NOFILE) &&
                      avio_open(&fmt->pb, path_utf8.constData(), AVIO_FLAG_WRITE) < 0) {
                      error = QStringLiteral("Cannot create MP4 recording on disk");
                      failed = true;
                      break;
                  }
                  if (avformat_write_header(fmt, nullptr) < 0) {
                      error = QStringLiteral("FFmpeg rejected the H.264 stream header");
                      failed = true;
                      break;
                  }
                  header_written = true;
                  packet = av_packet_alloc();
                  if (!packet) {
                      error = QStringLiteral("FFmpeg could not allocate video packet");
                      failed = true;
                      break;
                  }
                  for (;;) {
                      VideoSample sample;
                      {
                          std::unique_lock<std::mutex> lock(mutex_);
                          event_.wait(lock, [this]() { return stop_requested_ || !queue_.empty(); });
                          if (queue_.empty() && stop_requested_)
                              break;
                          sample = std::move(queue_.front());
                          queued_bytes_ -= static_cast<size_t>(sample.bytes.size());
                          queue_.pop_front();
                      }
                      // An MP4 must begin with a keyframe. Skip P-frames until the next IDR.
                      if (!received_idr) {
                          if (!sample.idr)
                              continue;
                          first_us = sample.capture_us;
                          received_idr = true;
                      }
                      if (av_new_packet(packet, sample.bytes.size()) < 0) {
                          error = QStringLiteral("Could not allocate compressed sample");
                          failed = true;
                          break;
                      }
                      memcpy(packet->data, sample.bytes.constData(), static_cast<size_t>(sample.bytes.size()));
                      int64_t pts = av_rescale_q(sample.capture_us - first_us,
                                                 AVRational{1, 1000000}, stream->time_base);
                      pts = std::max(pts, last_pts + 1);
                      last_pts = pts;
                      packet->pts = pts;
                      packet->dts = pts; // PS4 Remote Play H.264 uses low-latency, reordered-free frames.
                      packet->duration = av_rescale_q(1000000 / static_cast<int64_t>(fps_),
                                                      AVRational{1, 1000000}, stream->time_base);
                      packet->stream_index = stream->index;
                      if (sample.idr)
                          packet->flags |= AV_PKT_FLAG_KEY;
                      const int result = av_interleaved_write_frame(fmt, packet);
                      av_packet_unref(packet);
                      if (result < 0) {
                          error = QStringLiteral("FFmpeg MP4 packet write failed");
                          failed = true;
                          break;
                      }
                      ++written_frames;
                      if (fmt->pb && avio_tell(fmt->pb) >= kMaxFileBytes - 1048576) {
                          truncated = true;
                          active_.store(false);
                          std::lock_guard<std::mutex> lock(mutex_);
                          stop_requested_ = true;
                          break;
                      }
                  }
              } while (false);
          
              if (header_written && av_write_trailer(fmt) < 0) {
                  failed = true;
                  error = QStringLiteral("MP4 finalisation failed");
              }
              if (packet)
                  av_packet_free(&packet);
              if (fmt) {
                  if (fmt->pb && !(fmt->oformat->flags & AVFMT_NOFILE))
                      avio_closep(&fmt->pb);
                  avformat_free_context(fmt);
              }
              if (!received_idr || written_frames == 0) {
                  failed = true;
                  error = QStringLiteral("No H.264 keyframe captured; recording could not be saved");
              }
              if (failed)
                  QFile::remove(output_path);
              const qint64 bytes = failed ? 0 : QFile(output_path).size();
              {
                  std::lock_guard<std::mutex> lock(mutex_);
                  if (failed)
                      status_ = QStringLiteral("ERROR: ") + error;
                  else
                      status_ = QStringLiteral("Saved: ") + output_path +
                          QStringLiteral(" (%1 MB)%2").arg(bytes / 1000000.0, 0, 'f', 1)
                              .arg(truncated ? QStringLiteral(" [300 MB limit]") : QString());
                  active_.store(false);
                  stop_requested_ = true;
              }
          }
          UMCB_M1_SOURCE
          cat > /tmp/umcb_m1_apply.py <<'UMCB_M1_SCRIPT'
          #!/usr/bin/env python3
          """UMCB M1: deterministic source edits; run from repository root on M1 branch.
          Do not run on umcb/foundation. The recorder implementation files must already exist.
          """
          from pathlib import Path
          import subprocess
          
          BRANCH = "umcb/m1-frame-capture"
          branch = subprocess.check_output(["git", "branch", "--show-current"], text=True).strip()
          if branch != BRANCH:
              raise SystemExit(f"Refusing to edit {branch!r}: expected {BRANCH!r}")
          
          changes = {}
          def replace_once(path, old, new):
              original = changes.get(path)
              if original is None:
                  original = Path(path).read_text(encoding="utf-8")
              if original.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old[:100]!r}, found {original.count(old)}")
              changes[path] = original.replace(old, new, 1)
          
          replace_once("gui/include/streamsession.h", "class StreamSession : public QObject", "class UMCBVideoRecorder;\n\nclass StreamSession : public QObject")
          replace_once("gui/include/streamsession.h", "#include <QTimer>\n#include <QQueue>\n#include <QElapsedTimer>\n",
                       "#include <QTimer>\n#include <QQueue>\n#include <QElapsedTimer>\n#include <memory>\n")
          replace_once("gui/include/streamsession.h",
                       "\t\tChiakiFfmpegDecoder *ffmpeg_decoder;\n",
                       "\t\tChiakiFfmpegDecoder *ffmpeg_decoder;\n\t\tstd::unique_ptr<UMCBVideoRecorder> umcb_video_recorder;\n")
          replace_once("gui/include/streamsession.h",
                       "\t\tvoid Start();\n\t\tvoid Stop();\n",
                       "\t\tvoid Start();\n\t\tvoid Stop();\n"
                       "\t\tQ_INVOKABLE QString startUMCBRecording(int duration_seconds);\n"
                       "\t\tQ_INVOKABLE void stopUMCBRecording();\n"
                       "\t\tQ_INVOKABLE bool isUMCBRecording() const;\n"
                       "\t\tQ_INVOKABLE QString umcbRecordingStatus() const;\n"
                       "\t\tvoid feedUMCBVideoSample(const uint8_t *data, size_t size);\n")
          replace_once("gui/src/streamsession.cpp",
                       "#include <streamsession.h>\n",
                       "#include <streamsession.h>\n#include <umcbvideorecorder.h>\n")
          replace_once("gui/src/streamsession.cpp",
                       "static void FfmpegFrameCb(ChiakiFfmpegDecoder *decoder, void *user);\n",
                       "static void FfmpegFrameCb(ChiakiFfmpegDecoder *decoder, void *user);\n"
                       "static bool UMCBVideoSampleCb(uint8_t *buf, size_t buf_size, int32_t frames_lost, bool frame_recovered, void *user)\n"
                       "{\n"
                       "\tauto *s = static_cast<StreamSession *>(user);\n"
                       "\ts->feedUMCBVideoSample(buf, buf_size);\n"
                       "\treturn chiaki_ffmpeg_decoder_video_sample_cb(buf, buf_size, frames_lost, frame_recovered, s->GetFfmpegDecoder());\n"
                       "}\n")
          replace_once("gui/src/streamsession.cpp",
                       "{\n\tmic_buf.buf = nullptr;\n\tconnected = false;\n",
                       "{\n\tumcb_video_recorder = std::make_unique<UMCBVideoRecorder>(\n"
                       "\t\tconnect_info.video_profile.width, connect_info.video_profile.height,\n"
                       "\t\tconnect_info.video_profile.max_fps);\n"
                       "\tmic_buf.buf = nullptr;\n\tconnected = false;\n")
          replace_once("gui/src/streamsession.cpp",
                       "chiaki_session_set_video_sample_cb(&session, chiaki_ffmpeg_decoder_video_sample_cb, ffmpeg_decoder);",
                       "chiaki_session_set_video_sample_cb(&session, UMCBVideoSampleCb, this);")
          replace_once("gui/src/streamsession.cpp",
                       "void StreamSession::GoToBed()\n",
                       "QString StreamSession::startUMCBRecording(int seconds)\n"
                       "{\n\treturn umcb_video_recorder->start(seconds);\n}\n\n"
                       "void StreamSession::stopUMCBRecording()\n"
                       "{\n\tumcb_video_recorder->stop();\n}\n\n"
                       "bool StreamSession::isUMCBRecording() const\n"
                       "{\n\treturn umcb_video_recorder->active();\n}\n\n"
                       "QString StreamSession::umcbRecordingStatus() const\n"
                       "{\n\treturn umcb_video_recorder->status();\n}\n\n"
                       "void StreamSession::feedUMCBVideoSample(const uint8_t *data, size_t size)\n"
                       "{\n\tif (umcb_video_recorder)\n\t\tumcb_video_recorder->feed(data, size);\n}\n\n"
                       "void StreamSession::GoToBed()\n")
          replace_once("gui/CMakeLists.txt",
                       "\tinclude/streamsession.h\n\tsrc/streamsession.cpp\n",
                       "\tinclude/streamsession.h\n\tsrc/streamsession.cpp\n"
                       "\tinclude/umcbvideorecorder.h\n\tsrc/umcbvideorecorder.cpp\n")
          replace_once("gui/CMakeLists.txt",
                       "target_link_libraries(chiaki chiaki-lib)\n",
                       "target_link_libraries(chiaki chiaki-lib FFMPEG::avformat FFMPEG::avcodec FFMPEG::avutil)\n")
          
          controls = '''
              // UMCB M1: controlled, PS4-feed-only recording; no PS4 input is generated.
              // Keeping controls on the stream view avoids changing the existing video renderer.
              Rectangle {
                  id: umcbRecordingBar
                  anchors.top: parent.top
                  anchors.right: parent.right
                  anchors.margins: 12
                  z: 300
                  width: 268
                  height: 48
                  radius: 6
                  color: "#BB151515"
                  visible: !!Chiaki.session && Chiaki.session.connected && !view.sessionLoading && !view.sessionError
                  property bool recording: false
                  property string statusText: ""
                  RowLayout {
                      anchors.fill: parent
                      anchors.margins: 4
                      spacing: 4
                      Button {
                          text: "2 min"
                          enabled: !umcbRecordingBar.recording
                          onClicked: {
                              var result = Chiaki.session.startUMCBRecording(120)
                              umcbRecordingBar.statusText = result
                              umcbRecordingBar.recording = !result.startsWith("ERROR:")
                          }
                      }
                      Button {
                          text: "3 min"
                          enabled: !umcbRecordingBar.recording
                          onClicked: {
                              var result = Chiaki.session.startUMCBRecording(180)
                              umcbRecordingBar.statusText = result
                              umcbRecordingBar.recording = !result.startsWith("ERROR:")
                          }
                      }
                      Button {
                          text: "Stop"
                          enabled: umcbRecordingBar.recording
                          onClicked: {
                              Chiaki.session.stopUMCBRecording()
                              umcbRecordingBar.recording = false
                              umcbRecordingBar.statusText = Chiaki.session.umcbRecordingStatus()
                          }
                      }
                  }
                  Timer {
                      interval: 1000
                      repeat: true
                      running: !!Chiaki.session && umcbRecordingBar.recording
                      onTriggered: {
                          if (!Chiaki.session) {
                              umcbRecordingBar.recording = false
                          } else if (!Chiaki.session.isUMCBRecording()) {
                              // Auto-stop finalises the MP4 and updates status.
                              Chiaki.session.stopUMCBRecording()
                              umcbRecordingBar.recording = false
                              umcbRecordingBar.statusText = Chiaki.session.umcbRecordingStatus()
                          }
                      }
                  }
              }
              Shortcut {
                  sequence: "Ctrl+Shift+3"
                  context: Qt.ApplicationShortcut
                  enabled: !!Chiaki.session && Chiaki.session.connected
                  onActivated: {
                      if (!Chiaki.session.isUMCBRecording()) {
                          var result = Chiaki.session.startUMCBRecording(180)
                          umcbRecordingBar.statusText = result
                          umcbRecordingBar.recording = !result.startsWith("ERROR:")
                      }
                  }
              }
              Shortcut {
                  sequence: "Ctrl+Shift+S"
                  context: Qt.ApplicationShortcut
                  enabled: !!Chiaki.session && Chiaki.session.connected
                  onActivated: {
                      Chiaki.session.stopUMCBRecording()
                      umcbRecordingBar.recording = false
                      umcbRecordingBar.statusText = Chiaki.session.umcbRecordingStatus()
                  }
              }
          '''
          replace_once("gui/src/qml/StreamView.qml",
                       "    property bool sessionPinDialogActive: false\n",
                       "    property bool sessionPinDialogActive: false\n" + controls)
          
          # Verify all anchors first; only now write. A failure never leaves a half-patched tree.
          for path, content in changes.items():
              Path(path).write_text(content, encoding="utf-8")
          print("UMCB M1 source integration staged:", ", ".join(changes))
          UMCB_M1_SCRIPT
          python /tmp/umcb_m1_apply.py
          git diff --check
          git add gui/include/umcbvideorecorder.h gui/src/umcbvideorecorder.cpp gui/include/streamsession.h gui/src/streamsession.cpp gui/src/qml/StreamView.qml gui/CMakeLists.txt
          git rm .github/workflows/umcb-m1-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "UMCB M1: add PS4-only bounded MP4 recorder [skip ci]"
          git push origin HEAD:umcb/m1-frame-capture
          echo "UMCB M1 recording source committed successfully to the M1 branch."
