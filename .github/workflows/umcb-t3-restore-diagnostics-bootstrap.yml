# UMCB T3: isolated diagnostic source patch, NOT a Windows build workflow.
# Create branch umcb/test-vulkan-restore-t3 from exact T2 source commit 3a231e176ad01344f01be3ca1336a6b624e42d30.
# Adds bounded diagnostic logs and prevents using/releasing an image after hold failure.
# Do NOT commit onto foundation, M1, T1, T2 or main. Workflow removes itself once done.
name: UMCB T3 One-Time Vulkan Restore Diagnostics Setup
on:
  push:
    branches:
      - umcb/test-vulkan-restore-t3
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-once:
    if: github.ref == 'refs/heads/umcb/test-vulkan-restore-t3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Check exact T2 parent and source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '3a231e176ad01344f01be3ca1336a6b624e42d30' || { echo 'ABORT: T3 is not directly based on verified T2'; exit 1; }
          test "$(git hash-object gui/src/qmlmainwindow.cpp)" = 'aeb866370f0f6aa1708fc640d2018126eb4cd7bc' || { echo 'ABORT: C++ differs from verified T2'; exit 1; }
          test "$(git hash-object gui/include/qmlmainwindow.h)" = '7483bbb89a4bd3c4100daed08f963b089c33aaa8' || { echo 'ABORT: header differs from verified T2'; exit 1; }
          test -f .github/workflows/umcb-t3-restore-diagnostics-bootstrap.yml
          test -z "$(git status --porcelain)" || { echo 'ABORT: dirty checkout'; exit 1; }
      - name: Apply minimal restore diagnostics and failed-hold guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          patches = [
              ('gui/include/qmlmainwindow.h',
               '    QAtomicInteger<int> t2_reset_failure_count = 0;\n    QAtomicInteger<quint64> t2_background_video_frames = 0;\n',
               '    QAtomicInteger<int> t2_reset_failure_count = 0;\n    QAtomicInteger<quint64> t2_background_video_frames = 0;\n    // UMCB-T3: bounded diagnostics for Vulkan presentation restoration only.\n    QAtomicInteger<quint64> t3_restore_generation = 0;\n    QAtomicInteger<quint64> t3_swapchain_recreate_count = 0;\n    QAtomicInteger<quint64> t3_quick_hold_failures = 0;\n'),
              ('gui/src/qmlmainwindow.cpp',
               '    pl_vulkan_hold_ex(placebo_vulkan->gpu, &hold_params);\n    const qint64 quick_hold_after_us = static_cast<qint64>(chiaki_time_now_monotonic_us());\n',
               '    // UMCB-T3: A failed hold MUST NOT be followed by waiting on its unsignalled\n    // semaphore, Qt Quick rendering, or releasing an image libplacebo did not hold.\n    const bool t3_hold_ok = pl_vulkan_hold_ex(placebo_vulkan->gpu, &hold_params);\n    if (!t3_hold_ok) {\n        const quint64 failure_no = t3_quick_hold_failures.fetchAndAddRelaxed(1) + 1;\n        if (failure_no <= 12 || failure_no % 60 == 0)\n            qCWarning(chiakiGui) << "[UMCB-T3] Qt Quick image hold failed; skipped unsafe frame"\n                                 << "failure_no=" << failure_no\n                                 << "restore_generation=" << t3_restore_generation.loadAcquire()\n                                 << "swapchain_size=" << swapchain_size\n                                 << "pending_recreate=" << swapchain_recreate_pending.loadAcquire()\n                                 << "deferred_present=" << deferred_present_in_flight.loadAcquire();\n        return;\n    }\n    const qint64 quick_hold_after_us = static_cast<qint64>(chiaki_time_now_monotonic_us());\n'),
              ('gui/src/qmlmainwindow.cpp',
               '    const bool swapchain_recreated = swapchain_recreate_pending.fetchAndStoreRelaxed(0) != 0;\n    if (swapchain_recreated) {\n        destroySwapchain();\n        createSwapchain();\n        resizeSwapchain();\n    }\n',
               '    const bool swapchain_recreated = swapchain_recreate_pending.fetchAndStoreRelaxed(0) != 0;\n    if (swapchain_recreated) {\n        // UMCB-T3: only log the first few recreations and sparse checkpoints.\n        const quint64 recreation_no = t3_swapchain_recreate_count.fetchAndAddRelaxed(1) + 1;\n        const bool trace = recreation_no <= 24 || recreation_no % 100 == 0;\n        if (trace)\n            qCInfo(chiakiGui) << "[UMCB-T3] swapchain recreation begin"\n                             << "recreation_no=" << recreation_no\n                             << "restore_generation=" << t3_restore_generation.loadAcquire()\n                             << "old_swapchain=" << (placebo_swapchain != nullptr)\n                             << "quick_frame=" << quick_frame\n                             << "deferred_pending=" << (deferred_swap_thread && deferred_swap_thread->hasPendingWork())\n                             << "present_in_flight=" << deferred_present_in_flight.loadAcquire()\n                             << "window_size=" << size();\n        destroySwapchain();\n        createSwapchain();\n        resizeSwapchain();\n        if (trace)\n            qCInfo(chiakiGui) << "[UMCB-T3] swapchain recreation end"\n                             << "recreation_no=" << recreation_no\n                             << "new_swapchain=" << (placebo_swapchain != nullptr)\n                             << "swapchain_size=" << swapchain_size\n                             << "quick_frame=" << quick_frame;\n    }\n'),
              ('gui/src/qmlmainwindow.cpp',
               '        if (!minimised) {\n            // Recreate on the render thread once the window can be drawn to.\n            swapchain_recreate_pending.storeRelease(1);\n',
               '        if (!minimised) {\n            // T3 records each restore and the image-hold failure total so far.\n            const quint64 restoration_no = t3_restore_generation.fetchAndAddRelaxed(1) + 1;\n            qCInfo(chiakiGui) << "[UMCB-T3] Restore requested"\n                             << "restoration_no=" << restoration_no\n                             << "previous_hold_failures=" << t3_quick_hold_failures.loadAcquire()\n                             << "pending_recreate=" << swapchain_recreate_pending.loadAcquire()\n                             << "present_in_flight=" << deferred_present_in_flight.loadAcquire();\n            // Recreate on the render thread once the window can be drawn to.\n            swapchain_recreate_pending.storeRelease(1);\n'),
          ]
          paths = sorted({p for p, old, new in patches})
          originals = {p: Path(p).read_text(encoding="utf-8") for p in paths}
          updated = dict(originals)
          if any('UMCB-T3' in content for content in originals.values()):
              raise SystemExit('UMCB-T3 ABORT: patch marker already present')
          for p, old, new in patches:
              matches = updated[p].count(old)
              if matches != 1:
                  raise SystemExit(f"UMCB-T3 ABORT: expected one exact anchor in {p}, found {matches}")
              updated[p] = updated[p].replace(old, new, 1)
          for p in paths:
              if updated[p] == originals[p]:
                  raise SystemExit(f"UMCB-T3 ABORT: no change for {p}")
          for p in paths:
              Path(p).write_text(updated[p], encoding="utf-8")
          print("UMCB-T3: applied guarded Qt Quick image hold and bounded restoration diagnostics")
          PYCODE
          git diff --check
          git diff --stat
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'gui/include/qmlmainwindow.h' 'gui/src/qmlmainwindow.cpp' | sort)" || { echo 'ABORT: unexpected source changes'; exit 1; }
      - name: Commit isolated T3 patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui/include/qmlmainwindow.h gui/src/qmlmainwindow.cpp
          git rm .github/workflows/umcb-t3-restore-diagnostics-bootstrap.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/umcb-t3-restore-diagnostics-bootstrap.yml' 'gui/include/qmlmainwindow.h' 'gui/src/qmlmainwindow.cpp' | sort)" || { echo 'ABORT: unexpected staged paths'; exit 1; }
          git commit -m 'UMCB T3: instrument Vulkan restore and guard failed Qt Quick hold [skip ci]'
          git push origin HEAD:umcb/test-vulkan-restore-t3
