name: UMCB M1.1 - Fix observer worker initialization and session diagnostics

on:
  push:
    branches:
      - umcb/m1-decoded-frame-observer
    paths:
      - .github/workflows/umcb-m1-1-diagnostics-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-m1-1-diagnostics:
    name: Apply narrow observer fix and retire workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exactly the accepted M1.1 commit plus this workflow
        shell: bash
        run: |
          set -euo pipefail
          base=cfa960c99ab898bf36569727d14fa868df0354e2
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/umcb-m1-1-diagnostics-fix.yml'
          test -f gui/include/umcbframeobserver.h
          test -f gui/src/qmlbackend.cpp
          git diff --check "$base" HEAD

      - name: Fix initialization order and add session-visible activation message
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          header = Path("gui/include/umcbframeobserver.h")
          src = header.read_text(encoding="utf-8")
          old = """    std::condition_variable wake_;
              std::thread worker_;
              AVFrame *pending_ = nullptr;
              int64_t pendingAtUs_ = 0;
              uint64_t generation_ = 0;
              bool workerBusy_ = false;
              bool stopping_ = false;"""
          new = """    std::condition_variable wake_;
              AVFrame *pending_ = nullptr;
              int64_t pendingAtUs_ = 0;
              uint64_t generation_ = 0;
              bool workerBusy_ = false;
              bool stopping_ = false;
              // Construct the worker only after all state it can read.
              std::thread worker_;"""
          assert src.count(old) == 1, "observer member layout has changed: abort"
          header.write_text(src.replace(old, new), encoding="utf-8")

          backend = Path("gui/src/qmlbackend.cpp")
          src = backend.read_text(encoding="utf-8")
          old = """    chiaki_log_mutex.lock();
              chiaki_log_ctx = session->GetChiakiLog();
              chiaki_log_mutex.unlock();"""
          new = """    chiaki_log_mutex.lock();
              chiaki_log_ctx = session->GetChiakiLog();
              chiaki_log_mutex.unlock();
              // This is after the session log is attached, unlike the worker constructor.
              qCInfo(chiakiGui) << "[UMCB-M1.1] session_observer_enabled="
                                << (umcb_frame_observer ? 1 : 0)
                                << "sampling_max_fps=2";"""
          assert src.count(old) == 1, "session log hook has changed: abort"
          backend.write_text(src.replace(old, new), encoding="utf-8")
          print("PASS: member initialization order and session-visible log hook")
          PY

      - name: Self-retire workflow, commit and verify exact change list
        shell: bash
        run: |
          set -euo pipefail
          base=cfa960c99ab898bf36569727d14fa868df0354e2
          git rm -- .github/workflows/umcb-m1-1-diagnostics-fix.yml
          git add -- gui/include/umcbframeobserver.h gui/src/qmlbackend.cpp
          expected=$(printf 'gui/include/umcbframeobserver.h\ngui/src/qmlbackend.cpp')
          test "$(git diff --cached --name-only "$base")" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "UMCB M1.1: initialize observer worker last and log activation [skip ci]"
          test "$(git diff --name-only "$base" HEAD)" = "$expected"
          git diff --check "$base" HEAD
          git push origin HEAD:umcb/m1-decoded-frame-observer
          echo 'PASS: isolated M1.1 diagnostic fix; accepted Foundation V2 unchanged.'
