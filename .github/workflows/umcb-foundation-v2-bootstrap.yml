name: UMCB Foundation V2 - Install T8 Semaphore Continuity

on:
  push:
    branches:
      - umcb/foundation-v2-integration
    paths:
      - .github/workflows/umcb-foundation-v2-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-t8-source-fix:
    name: Integrate only tested T8 counter fix into T5 source
    runs-on: ubuntu-latest
    steps:
      - name: Check out Foundation V2 integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact frozen T5 ancestry and source blob
        shell: bash
        run: |
          set -euo pipefail
          base=838512a440fb838485fc90d1d2f3542c784d67fd
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-parse HEAD:gui/src/qmlmainwindow.cpp)" = '0690754262d232c069702a245bc0fb667dd63da5'
          test "$(git diff --name-only "$base" HEAD)" = '.github/workflows/umcb-foundation-v2-bootstrap.yml'
          echo 'PASS: exact frozen T5 parent, exact T5 renderer source, bootstrap file only.'

      - name: Apply one-place T8 source correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('gui/src/qmlmainwindow.cpp')
          source = path.read_bytes()
          old = (b'    quick_vk_format = vk_format;\n'
                 b'    quick_sem_value = 0;\n'
                 b'    swapchain_size = new_swapchain_size;')
          new = (b'    quick_vk_format = vk_format;\n'
                 b'    // Preserve the timeline counter when recreating only the texture.\n'
                 b'    // The same Vulkan timeline semaphore remains alive across resize.\n'
                 b'    swapchain_size = new_swapchain_size;')
          if source.count(old) != 1:
              raise SystemExit('ABORT: T5 resize-counter anchor missing or repeated')
          teardown = b'    quick_sem = VK_NULL_HANDLE;\n    quick_sem_value = 0;'
          if source.count(teardown) != 1 or source.count(b'quick_sem_value = 0;') != 2:
              raise SystemExit('ABORT: semaphore teardown/reset invariants changed')
          patched = source.replace(old, new, 1)
          if patched.count(b'quick_sem_value = 0;') != 1 or patched.count(teardown) != 1:
              raise SystemExit('ABORT: teardown reset was disturbed')
          path.write_bytes(patched)
          print('PASS: resize-only reset removed; teardown reset retained.')
          PY
          test "$(git diff --name-only)" = 'gui/src/qmlmainwindow.cpp'
          git diff --check -- gui/src/qmlmainwindow.cpp
          git diff --stat -- gui/src/qmlmainwindow.cpp

      - name: Commit permanent source fix and retire one-time bootstrap
        shell: bash
        run: |
          set -euo pipefail
          base=838512a440fb838485fc90d1d2f3542c784d67fd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/umcb-foundation-v2-bootstrap.yml
          git add -- gui/src/qmlmainwindow.cpp .github/workflows/umcb-foundation-v2-bootstrap.yml
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "$(printf '.github/workflows/umcb-foundation-v2-bootstrap.yml\ngui/src/qmlmainwindow.cpp')"
          git commit -m 'UMCB Foundation V2: preserve Vulkan timeline semaphore counter across resize [skip ci]'
          test "$(git diff --name-only "$base" HEAD)" = 'gui/src/qmlmainwindow.cpp'
          git diff --check "$base" HEAD
          git push origin HEAD:umcb/foundation-v2-integration
          echo 'PASS: branch updated; compared to T5, only permanent renderer source changed.'
          echo 'NEXT: Run Build chiaki-ng msys2 x86 Windows manually on the new branch.'
