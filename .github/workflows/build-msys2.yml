                  auto *v7stop = new QPushButton(QStringLiteral("STOP v7"),dialog);
                  layout->addWidget(v7start);
                  layout->addWidget(v7stop);
                  auto *v7status = new QLabel(QStringLiteral("Idle: press START from normal Minecraft gameplay."),dialog);
                  v7status->setWordWrap(true);
                  layout->addWidget(v7status);
                  ug79_v7_status = v7status;
                  connect(v7start,&QPushButton::clicked,dialog,[this]() { Ug79V7Start(); });
                  connect(v7stop,&QPushButton::clicked,dialog,[this]() {
                      Ug79V7Halt(QStringLiteral("user pressed STOP"));
                  });
                  connect(dialog,&QObject::destroyed,this,[this]() {
                      ug79_v7_status=nullptr;
                      Ug79V7Halt(QStringLiteral("test panel was closed"));
                  });
              }
              ug79KbV2Log("KB_V4_FULLCYCLE_PANEL_SHOWN");''',
              'dedicated one-click autoplay dashboard')
          hppp.write_text(hpp,encoding='utf-8')
          cppp.write_text(cpp,encoding='utf-8')
          print('V7.1 CALIBRATED verifier patch complete. Opt-in ONLY.')
          PY

      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: ${{ github.event.inputs.libplacebo_version }}

      - name: Setup FFmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Build SDL2 compatibility layer
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure Chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF

      - name: Build Chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy portable Chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Add AMD Vulkan workaround launcher
        run: |
          printf '@echo off\r\nset "VK_LOADER_DRIVERS_DISABLE=*dzn*"\r\nstart "" "%%~dp0chiaki.exe"\r\n' > chiaki-ng-Win/Launch-UG79.cmd

      - name: Add explicit diagnostic launchers and safety notes
        run: |
          python - <<'PY'
          from pathlib import Path
          folder = Path('chiaki-ng-Win')
          folder.mkdir(exist_ok=True)
          launchers = {
              'Launch-KB-Observe.cmd': ('off', 'KBPROBE-Observe.log'),
              'TEST-KB-Enable-RISK-Disconnect.cmd': ('enable', 'KBPROBE-Enable.log'),
              'TEST-KB-Toggle-RISK-Disconnect.cmd': ('toggle', 'KBPROBE-Toggle.log'),
              'TEST-KB-Both-RISK-Disconnect.cmd': ('both', 'KBPROBE-Both.log'),
              'TEST-Native-Text-v2.cmd': ('both', 'KBPROBE-NativeText-v2.log'),
              'TEST-Native-Batch-v3.cmd': ('both', 'KBPROBE-NativeBatch-v3.log'),
              'TEST-Full-Cycle-v4.cmd': ('both', 'KBPROBE-FullCycle-v4.log'),
              'TEST-MultiSpeed-v5.cmd': ('both', 'KBPROBE-MultiSpeed-v5.log'),
              'TEST-Bedrock-SpeedBuild-v6.cmd': ('both', 'KBPROBE-Bedrock-SpeedBuild-v6.log'),
              'TEST-Bedrock-AutoVerify-v7-1.cmd': ('both', 'KBPROBE-Bedrock-AutoVerify-v7-1.log'),
          }
          for filename, (mode, logfile) in launchers.items():
              commands = [
                  '@echo off',
                  'cd /d "%~dp0"',
                  'set "VK_LOADER_DRIVERS_DISABLE=*dzn*"',
                  f'set "CHIAKI_KB_PROBE={mode}"',
                  f'set "CHIAKI_KB_DIAG_LOG=%~dp0{logfile}"',
                  'set "CHIAKI_KB_BATCH=1"' if filename in ('TEST-Native-Batch-v3.cmd', 'TEST-Full-Cycle-v4.cmd', 'TEST-MultiSpeed-v5.cmd', 'TEST-Bedrock-SpeedBuild-v6.cmd', 'TEST-Bedrock-AutoVerify-v7-1.cmd') else 'set "CHIAKI_KB_BATCH=0"',
                  'set "CHIAKI_KB_FULLCYCLE=1"' if filename in ('TEST-Full-Cycle-v4.cmd', 'TEST-MultiSpeed-v5.cmd', 'TEST-Bedrock-SpeedBuild-v6.cmd', 'TEST-Bedrock-AutoVerify-v7-1.cmd') else 'set "CHIAKI_KB_FULLCYCLE=0"',
                  'set "CHIAKI_KB_SPEED_PROFILES=1"' if filename in ('TEST-MultiSpeed-v5.cmd', 'TEST-Bedrock-SpeedBuild-v6.cmd', 'TEST-Bedrock-AutoVerify-v7-1.cmd') else 'set "CHIAKI_KB_SPEED_PROFILES=0"',
                  'set "CHIAKI_KB_BUILD_TEST=1"' if filename == 'TEST-Bedrock-SpeedBuild-v6.cmd' else 'set "CHIAKI_KB_BUILD_TEST=0"',
                  'set "CHIAKI_KB_AUTO_VERIFY=1"' if filename == 'TEST-Bedrock-AutoVerify-v7-1.cmd' else 'set "CHIAKI_KB_AUTO_VERIFY=0"',
                  'start "" "%~dp0chiaki.exe"',
              ]
              (folder / filename).write_bytes(('\r\n'.join(commands) + '\r\n').encode('utf-8'))
          (folder / 'READ-ME-KEYBOARD-TEST.txt').write_text(
              'PS4 NATIVE TEXT TESTING - experimental v5, plus previous diagnostic launchers\n'
              '1. Extract this portable ZIP to its own folder. Do not replace a working Chiaki folder.\n'
              '2. Close other Chiaki windows before testing.\n'
              '3. Launch-KB-Observe.cmd is the safe baseline. It sends NO keyboard negotiation messages.\n'
              '4. The TEST-KB-* launchers deliberately send experimental messages and MAY DISCONNECT REMOTE PLAY.\n'
              '5. Keyboard probes are disabled by default, and the Minecraft controller tools remain present.\n'
              '6. Each launcher writes a separate KBPROBE-*.log file in this extracted folder.\n'
              '7. Do not enable verbose packet dumps or publish credentials/tokens/session IDs.\n'
              '8. A SENT_TO_TRANSPORT line is NOT proof that the PlayStation accepted a message.\n'
              '9. Do not run any TEST-KB launcher unless you are prepared for possible disconnection.\n'
              '10. v2: TEST-Native-Text-v2.cmd opens an opt-in Windows text dialog when PS4 sends KEYBOARD_OPEN.\n'
              '11. v2: First click Send Text with hello123 and inspect Minecraft; then click Accept / Done.\n'
              '12. v2: The text content is never placed in KBPROBE diagnostic logs.\n'
              '13. v3: TEST-Native-Batch-v3.cmd opens a bounded queued command dialog when PS4 keyboard first opens.\n'
              '14. Open Minecraft chat and keyboard manually once; paste one slash-command per line, then click Start Batch.\n'
              '15. v3 sends each command, awaits PS4 text response, accepts, awaits close, then taps RIGHT and CROSS to reopen.\n'
              '16. STOP Batch and timeouts halt the automation. Max 40 total commands per batch.\n'
              '17. Use harmless /say tests first; protocol replies do not prove Minecraft executed commands.\n'
              '18. V4: TEST-Full-Cycle-v4.cmd shows the setup panel after Chiaki connects; do not manually open chat.\n'
              '19. In normal Minecraft gameplay, click Start Full Cycle to automatically open chat for the FIRST command.\n'
              '20. V4 test permits /say only (max 40); log KBPROBE-FullCycle-v4.log contains KB_V4_MS timestamps.\n'
              '21. V4 is experimental. Stop on any unexpected behaviour; source files and V3 remain unchanged.\n'
              '22. V5: TEST-MultiSpeed-v5.cmd contains SIX per-batch selectable timings.\n'
              '23. Run /say only. Check all Minecraft messages and order before trying a faster profile.\n'
              '24. V5 writes profile-tagged KBPROBE-MultiSpeed-v5.log millisecond timing data.\n'
              '25. V5 shows commands/min after each completed run; protocol acknowledgments do not verify game execution.\n'
              '26. V6: TEST-Bedrock-SpeedBuild-v6.cmd enables /fill, /setblock, /clone, /structure save/load.\n'
              '27. V6: Create a BACKUP or use an empty TEST WORLD first; commands change Minecraft blocks.\n'
              '28. V6: Minecraft Creative and cheats required; verify ALL world changes and actual execution.\n'
              '29. V6: Select P0 for baseline then P3; P4/P5 are blocked for building tests.\n'
              '30. V6: Limit 40 commands per batch, 80 UTF-8 bytes each; restricted allowlist.\n'
              '31. V6: Writes KBPROBE-Bedrock-SpeedBuild-v6.log; game-side correctness requires human verification.\n',
              encoding='utf-8',
          )
          print('PSN keyboard experiment launchers generated.')
          PY

      - name: Add V7 unattended test instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('chiaki-ng-Win/README-V7-AUTO-TEST.txt').write_text("CHIAKI V7.1 - CALIBRATED BEDROCK SPEED VERIFICATION - EXPERIMENTAL\n\nSTATUS: Source workflow verified offline; NOT YET Windows compiled or PS4 tested.\nThe existing successful v6 GitHub branch / build stays unchanged.\n\nThis is a conservative prototype for automatic building-speed comparisons.\nIt uses Chiaki's existing PS4 native text automation plus a Bedrock-world\nverifier, and captures the rendered Chiaki stream window to read a result title.\n\nHOW TO RUN (AFTER BUILDING V7 ON AN EXPERIMENTAL BRANCH):\n1. Extract the v7 portable artifact to its OWN folder; leave v6 untouched.\n2. Create a DISPOSABLE/backup Minecraft Bedrock Creative world with cheats ON.\n3. Stand STILL in gameplay in a suitably empty area with room for the test.\n   The test WILL change 64 block positions relative to your feet:\n   X=+2..+9, Z=+2..+5, Y=-3 and Y=-2. Stand safely and avoid moving.\n4. Start TEST-Bedrock-AutoVerify-v7-1.cmd and connect Remote Play.\n5. Keep the Minecraft video window visible (at least 640x360), with no\n   overlapping dialogs or notifications in the centre. Place the control\n   panel off to one side, and do not resize the stream during a run.\n6. Press START v7 AUTOTUNE ONCE with the in-game chat/keyboard CLOSED.\n   Then leave the controller, keyboard and camera alone. STOP is always available.\n\nEach trial (37 commands, under the existing 40-command safety limit):\n   /title clear -> reference /fill -> target reset /fill -> 32 /setblock\n   -> RED FAIL title -> /execute if blocks ... all run GREEN PASS title.\nThe 32 positions are compared IN GAME by Bedrock's own /execute condition.\nThe program first calibrates real red FAIL and green PASS glyph shapes,\nthen verifies a second RED negative control does not match PASS.\nEach construction trial requires THREE separate PASS-shaped video samples.\nAny FAIL, unreadable title, or ambiguous screen halts immediately.\n\nTiming series: first 400/620ms (known P2), then 400/590, 400/560,\n400/530, 400/500, 400/470, 400/440, 400/410, 400/400.\nThree trials of 32 block changes at each speed (999 trial commands).\nAn additional nine harmless title commands calibrate the visual feedback.\nAny PS4 response timeout, text mismatch, failure, or unclear screen HALTS\nfuture trials. Never blindly continues to faster settings on errors.\n\nResults: KBPROBE-Bedrock-AutoVerify-v7-1.log (timestamps/profiles).\nOne failure image may be written as KBPROBE-Bedrock-AutoVerify-v7-1.log.v7-failure.png.\nTreat logs and any screenshot as PRIVATE, since game/PSN details may be visible.\n\nLIMITATIONS:\n- Windows build, stream capture and game title colour recognition not yet\n  validated on your PC/PS4 yet. Calibration may halt safely.\n- Verification proves the resulting test pattern is correct when it reports\n  PASS; it does not independently prove every intermediate command was executed.\n- A successful short trial never guarantees 100% reliability for future builds.\n- The test changes world blocks. No automatic cleanup; use a disposable world.\n- This initial experiment tunes only Right-to-Cross time with 400ms reopen.\n  It is not yet a complete 2D search of all timing variables.\n- No screenshot is uploaded anywhere; only one local failure image is saved.\n\nNo source is modified in the preserved v6 branch. This v7 must be compiled\non a NEW EXPERIMENTAL branch; do not overwrite the working version.\n",encoding='utf-8')
          PY

      - name: Package portable prototype
        run: |
          zip -r chiaki-ng-bedrock-auto-verify-v7-1-win64.zip chiaki-ng-Win

      - name: Upload portable prototype
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-bedrock-auto-verify-v7-1-win64
          path: chiaki-ng-bedrock-auto-verify-v7-1-win64.zip
          if-no-files-found: error
          retention-days: 7
