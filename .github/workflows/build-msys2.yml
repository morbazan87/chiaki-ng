              'keyboard_event.type = CHIAKI_EVENT_KEYBOARD_REMOTE_CLOSE;',
              'kbprobe_event("KEYBOARD_REMOTE_CLOSE_RECEIVED");\n\tkeyboard_event.type = CHIAKI_EVENT_KEYBOARD_REMOTE_CLOSE;',
