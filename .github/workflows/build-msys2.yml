                          auto *acceptButton = new QPushButton(QStringLiteral("Accept / Done"), dialog);
                          auto *cancelButton = new QPushButton(QStringLiteral("Cancel"), dialog);
                          acceptButton->setEnabled(false); // Separate text send and accept for diagnosis.
                          buttons->addWidget(sendButton);
                          buttons->addWidget(acceptButton);
                          buttons->addWidget(cancelButton);
                          layout->addLayout(buttons);
                          ug79_native_kb_dialog = dialog;
                          connect(dialog, &QObject::destroyed, this, [this]() {
                              ug79_native_kb_dialog = nullptr;
