              if(img.width()<640 || img.height()<360)
              {if(ug79_v8_status)ug79_v8_status->setText(
                  QStringLiteral("No sufficiently large video frame. Nothing sent."));return;}
              const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
              QFile test(path);
              if(path.isEmpty() || !test.open(QIODevice::Append|QIODevice::WriteOnly|QIODevice::Text))
              {if(ug79_v8_status)ug79_v8_status->setText(
                  QStringLiteral("Cannot write v8 log; check folder permissions. Nothing sent."));return;}
              test.write("WALL_V8_LOG_WRITE_OK\n");
              test.close();
              ug79_v8_reopen=reopen;
              ug79_v8_cross=cross;
              ug79_v8_repeats=repeats;
              ug79_v8_completed=0;
              ug79_v8_trial_ms=0;
              ug79_v8_cells.clear();
              ug79_v8_session=QString::number(QDateTime::currentMSecsSinceEpoch());
              ug79_v8_running=true;
              ug79_v8_stage=1;
              Ug79V8Log(QStringLiteral("START; user must be Y~260, clear sky, creative cheats; world +Z"));
              Ug79V8Send(QStringList{QStringLiteral("/tp @s ~ ~ ~ 0 0")},850,620,
                         QStringLiteral("ALIGN_POSITIVE_Z"));
          }

          // V8.1 reference regions measured from the user's proven 32/32 wall image.
          // The calibration screenshots were 1924 x 1050. This is deliberately
          // NOT an automatic search for columns and rows: HUD notifications
          // and chat messages cannot introduce phantom target positions.
          // The positions scale to the current video frame. Each run still
          // learns live block and empty-sky colours from its own two frames.
          bool StreamSession::Ug79V8Learn()
          {
              if(ug79_v8_full.isNull() || ug79_v8_empty.isNull() ||
                 ug79_v8_full.size()!=ug79_v8_empty.size())return false;
              const int w=ug79_v8_full.width(),h=ug79_v8_full.height();
              if(w<640 || h<360)return false;
              // Changes to the stream crop/aspect ratio invalidate screenshot
              // pixel coordinates; do not report misleading speed results.
              const qint64 aspectError=qAbs(qint64(w)*1050-qint64(h)*1924);
              if(aspectError>qint64(h)*1924/25) // 4 percent tolerance
              {
                  Ug79V8Log(QStringLiteral("CALIBRATION_FRAME_ASPECT_MISMATCH width=%1 height=%2 reference=1924x1050")
                      .arg(w).arg(h));
                  return false;
              }
              // Permyriad-of-frame centres. Columns are left to right;
              // rows are top to bottom (red, yellow, lime, magenta).
              const int x10000[8]={3519,3945,4366,4792,5223,5650,6071,6497};
              const int y10000[4]={3486,4267,5048,5829};
              const int radiusX=qMax(3,w*70/10000);
              const int radiusY=qMax(3,h*100/10000);
              ug79_v8_cells.clear();
              Ug79V8Log(QStringLiteral("CALIBRATION_FIXED_REGIONS 8x4 frame=%1x%2 from_reference=1924x1050 rx=%3 ry=%4")
                  .arg(w).arg(h).arg(radiusX).arg(radiusY));
              for(int row=0;row<4;++row)
                  for(int col=0;col<8;++col)
                  {
                      const int cx=(w*x10000[col]+5000)/10000;
                      const int cy=(h*y10000[row]+5000)/10000;
                      const QRect r(cx-radiusX,cy-radiusY,
                          2*radiusX+1,2*radiusY+1);
                      if(!ug79_v8_full.rect().contains(r))
                      {
                          Ug79V8Log(QStringLiteral("CALIBRATION_OUTSIDE_FRAME slot=%1")
                              .arg(row*8+col+1));
                          return false;
                      }
                      qint64 difference=0,points=0;
                      for(int y=r.top();y<=r.bottom();y+=2)
                          for(int x=r.left();x<=r.right();x+=2)
                          {
                              const QColor a(ug79_v8_full.pixel(x,y));
                              const QColor b(ug79_v8_empty.pixel(x,y));
                              difference+=qAbs(a.red()-b.red())+
                                  qAbs(a.green()-b.green())+qAbs(a.blue()-b.blue());
                              ++points;
                          }
                      const int avg=points?int(difference/points):0;
                      if(points<12 || avg<100)
                      {
                          Ug79V8Log(QStringLiteral("CALIBRATION_WEAK_FIXED_REGION slot=%1 x=%2 y=%3 delta=%4 samples=%5")
                              .arg(row*8+col+1).arg(cx).arg(cy)
                              .arg(avg).arg(points));
                          ug79_v8_cells.clear();
                          return false;
                      }
                      ug79_v8_cells.append(r);
                  }
              Ug79V8Log(QStringLiteral("CALIBRATION_FIXED_REGIONS_PASS count=%1")
                  .arg(ug79_v8_cells.size()));
              return ug79_v8_cells.size()==32;
          }

          bool StreamSession::Ug79V8EmptyVerified() const
          {
              const QImage img=Ug79V7Capture();
              if(img.size()!=ug79_v8_empty.size() || ug79_v8_cells.size()!=32)return false;
              for(const QRect &r:ug79_v8_cells)
              {
                  qint64 error=0,n=0;
                  for(int y=r.top();y<=r.bottom();y+=2)
                      for(int x=r.left();x<=r.right();x+=2)
                      {
                          const QColor a(img.pixel(x,y)),b(ug79_v8_empty.pixel(x,y));
                          error+=qAbs(a.red()-b.red())+qAbs(a.green()-b.green())+
                              qAbs(a.blue()-b.blue());++n;
                      }
                  if(!n || error/n>75)return false;
              }
              return true;
          }

          void StreamSession::Ug79V8Score()
          {
              if(!ug79_v8_running || ug79_v8_stage!=5)return;
              const QImage img=Ug79V7Capture();
              if(img.isNull() || img.size()!=ug79_v8_full.size())
              {Ug79V8Report(QStringLiteral("VISUAL_UNAVAILABLE"),0,0,32,
                  QStringLiteral("video lost/resized"));
               Ug79V8Stop(QStringLiteral("video unavailable during test scoring"));return;}
              int correct=0,missing=0,uncertain=0;
              QStringList wrong,unknown;
              const QString base=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
              QFile details(base+QStringLiteral(".wall-blocks.csv"));
              if(details.open(QIODevice::Append|QIODevice::WriteOnly|QIODevice::Text) && details.size()==0)
                  details.write("utc,session,trial,command,classification,full_error,empty_error\n");
              for(int i=0;i<ug79_v8_cells.size();++i)
              {
                  const QRect r=ug79_v8_cells[i];
                  qint64 ef=0,ee=0,n=0;
                  for(int y=r.top();y<=r.bottom();y+=2)
                      for(int x=r.left();x<=r.right();x+=2)
                      {
                          const QColor a(img.pixel(x,y));
                          const QColor f(ug79_v8_full.pixel(x,y));
                          const QColor e(ug79_v8_empty.pixel(x,y));
                          ef+=qAbs(a.red()-f.red())+qAbs(a.green()-f.green())+
                              qAbs(a.blue()-f.blue());
                          ee+=qAbs(a.red()-e.red())+qAbs(a.green()-e.green())+
                              qAbs(a.blue()-e.blue());++n;
                      }
                  const int ferr=n?int(ef/n):9999, eerr=n?int(ee/n):9999;
                  QString verdict;
                  if(ferr<85 && ferr+50<eerr){++correct;verdict=QStringLiteral("CORRECT");}
                  else if(eerr<85 && eerr+50<ferr)
                  {++missing;wrong << QString::number(i+1);verdict=QStringLiteral("MISSING");}
                  else{++uncertain;unknown << QString::number(i+1);verdict=QStringLiteral("UNCERTAIN");}
                  if(details.isOpen())
                      details.write(QStringLiteral("%1,%2,%3,%4,%5,%6,%7\n")
                          .arg(QDateTime::currentDateTimeUtc().toString(Qt::ISODateWithMs))
                          .arg(ug79_v8_session).arg(ug79_v8_completed+1).arg(i+1)
                          .arg(verdict).arg(ferr).arg(eerr).toUtf8());
              }
              const QString outcome=uncertain?QStringLiteral("VISUAL_UNCERTAIN"):
                  (missing?QStringLiteral("MISSING_BLOCKS"):QStringLiteral("PASS"));
              const QString reason=QStringLiteral("missing=[%1] uncertain=[%2]")
                  .arg(wrong.join(QStringLiteral("|")),unknown.join(QStringLiteral("|")));
              Ug79V8Report(outcome,correct,missing,uncertain,reason);
              if(correct!=32 || uncertain)
                  img.save(base+QStringLiteral(".wall-last-failure.png"),"PNG");
              Ug79V8Log(QStringLiteral("TRIAL_RESULT %1 correct=%2 missing=%3 uncertain=%4 ms=%5 %6")
                  .arg(outcome).arg(correct).arg(missing).arg(uncertain)
                  .arg(ug79_v8_trial_ms).arg(reason));
              ++ug79_v8_completed;
              if(ug79_v8_status)
                  ug79_v8_status->setText(QStringLiteral("Trial %1/%2: %3 of 32 blocks correct; %4 missing, %5 uncertain; "
                      "%6 correct commands/min. Resetting wall...")
                      .arg(ug79_v8_completed).arg(ug79_v8_repeats).arg(correct)
                      .arg(missing).arg(uncertain)
                      .arg(ug79_v8_trial_ms>0 ? 60000.0*correct/ug79_v8_trial_ms : 0.0,0,'f',2));
              ug79_v8_stage=6;
              QTimer::singleShot(550,this,[this](){
                  Ug79V8Send(QStringList{QStringLiteral("/fill ~-7 ~-1 ~20 ~7 ~5 ~20 air")},
                      850,620,QStringLiteral("RESET_AFTER_TRIAL"));
              });
          }

          void StreamSession::Ug79V8OnBatchStop(const QString &reason)
          {
              if(!ug79_v8_running)return;
              const int phase=ug79_v8_stage;
              // The existing native state machine has already stopped and released buttons.
              if(!reason.startsWith(QStringLiteral("Queue complete:")))
              {
                  if(phase==5)
                  {
                      ug79_v8_trial_ms=ug79_v4_clock.elapsed();
                      Ug79V8Report(QStringLiteral("PROTOCOL_FAIL"),0,0,32,
                          QStringLiteral("failed at command %1: %2; not scored")
                          .arg(ug79_batch_index+1).arg(reason));
                  }
                  Ug79V8Stop(QStringLiteral("protocol failure: ")+reason+
                      QStringLiteral(". Manually restore normal gameplay before retrying."));
                  return;
              }
              if(phase==5)ug79_v8_trial_ms=ug79_v4_clock.elapsed();
              Ug79V8Log(QStringLiteral("BATCH_COMPLETE phase=%1 count=%2 ms=%3")
                  .arg(phase).arg(ug79_batch_index).arg(ug79_v4_clock.elapsed()));
              const int settle=(phase==3||phase==5)?3400:2000;
              QTimer::singleShot(settle,this,[this,phase](){
                  if(!ug79_v8_running || ug79_v8_stage!=phase || !connected)return;
                  const QString clear=QStringLiteral("/fill ~-7 ~-1 ~20 ~7 ~5 ~20 air");
                  if(phase==1)
                  {
                      ug79_v8_stage=2;
                      Ug79V8Send(QStringList{clear},850,620,QStringLiteral("CLEAR_BEFORE_CAL"));
                  }
                  else if(phase==2)
                  {
                      ug79_v8_empty=Ug79V7Capture();
                      if(ug79_v8_empty.width()<640 || ug79_v8_empty.height()<360)
                      {Ug79V8Stop(QStringLiteral("blank reference capture failed"));return;}
                      const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
                      ug79_v8_empty.save(path+QStringLiteral(".wall-empty.png"),"PNG");
                      ug79_v8_stage=3;
                      Ug79V8Send(Ug79V8WallCommands(),850,620,QStringLiteral("CALIBRATION_32"));
                  }
                  else if(phase==3)
                  {
                      ug79_v8_full=Ug79V7Capture();
                      const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
                      ug79_v8_full.save(path+QStringLiteral(".wall-filled.png"),"PNG");
                      if(!Ug79V8Learn())
                      {Ug79V8Stop(QStringLiteral("32-block calibration wasn't visually unambiguous. "
                          "Check saved full/empty screenshots. No speed test sent."));return;}
                      Ug79V8Log(QStringLiteral("CALIBRATION_PASS 32 distinct visible block positions"));
                      ug79_v8_stage=4;
                      Ug79V8Send(QStringList{clear},850,620,QStringLiteral("CLEAR_AFTER_CAL"));
                  }
                  else if(phase==4 || phase==6)
                  {
                      if(!Ug79V8EmptyVerified())
                      {Ug79V8Stop(QStringLiteral("reset didn't restore the calibrated empty view"));return;}
                      if(ug79_v8_completed>=ug79_v8_repeats)
                      {Ug79V8Stop(QStringLiteral("COMPLETE: %1 trials; analyse wall-results.csv")
                          .arg(ug79_v8_completed));return;}
                      ug79_v8_stage=5;
                      Ug79V8Send(Ug79V8WallCommands(),ug79_v8_reopen,
                          ug79_v8_cross,QStringLiteral("TIMED_TRIAL_%1").arg(ug79_v8_completed+1));
                  }
                  else if(phase==5) Ug79V8Score();
              });
          }

          void StreamSession::Ug79V8ShowPanel(QDialog *dialog,QVBoxLayout *layout)
          {
              dialog->setWindowTitle(QStringLiteral("Chiaki v8 - Visual Wall Speed Tester"));
              for(QWidget *old:dialog->findChildren<QWidget*>())old->hide();
              auto *info=new QLabel(QStringLiteral(
                  "TEST WORLD ONLY, Creative + cheats. Stand at Y about 260 with empty sky. "
                  "This test rotates view to +Z using /tp @s ~ ~ ~ 0 0 (position unchanged). "
                  "Do not move or rotate after starting. Wall at Z+20, X -7..+7, Y -1..+5. "
                  "Calibration builds a 32-block 8x4 reference at 850/620ms, captures it, "
                  "clears it and verifies empty sky. Timed batches build those same 32 "
                  "positions. Reset is NOT timed. Only run in a disposable area. "
                  "No auto-retry if keyboard state becomes unknown."),dialog);
              info->setWordWrap(true);
              layout->addWidget(info);
              auto *r=new QSpinBox(dialog);
              r->setRange(150,1500);r->setSingleStep(1);r->setValue(400);
              auto *c=new QSpinBox(dialog);
              c->setRange(200,1500);c->setSingleStep(1);c->setValue(400);
              auto *n=new QSpinBox(dialog);
              n->setRange(1,10);n->setValue(3);
              auto *row=new QHBoxLayout();
              row->addWidget(new QLabel(QStringLiteral("Reopen ms"),dialog));row->addWidget(r);
              row->addWidget(new QLabel(QStringLiteral("Right-to-Cross ms"),dialog));row->addWidget(c);
              row->addWidget(new QLabel(QStringLiteral("Repeat batches"),dialog));row->addWidget(n);
              layout->addLayout(row);
              auto *start=new QPushButton(QStringLiteral("CALIBRATE WALL + RUN TIMED BATCHES"),dialog);
              auto *stop=new QPushButton(QStringLiteral("STOP v8"),dialog);
              layout->addWidget(start);layout->addWidget(stop);
              auto *status=new QLabel(QStringLiteral("Idle. Start from normal gameplay, chat/PS keyboard closed. "
                  "Keep video unobscured at 640x360 or higher. Log: ")+
                  qEnvironmentVariable("CHIAKI_KB_DIAG_LOG"),dialog);
              status->setWordWrap(true);
              ug79_v8_status=status;
              layout->addWidget(status);
              QObject::connect(start,&QPushButton::clicked,dialog,[this,r,c,n](){
                  Ug79V8Start(r->value(),c->value(),n->value());
              });
              QObject::connect(stop,&QPushButton::clicked,dialog,[this](){
                  Ug79V8Stop(QStringLiteral("user pressed STOP"));
              });
              QObject::connect(dialog,&QObject::destroyed,this,[this](){
                  ug79_v8_status=nullptr;
                  Ug79V8Stop(QStringLiteral("v8 test panel closed"));
              });
          }

