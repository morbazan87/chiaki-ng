name: Build Chiaki-ng Windows - UG79 analogue controller probe v4

on:
  workflow_dispatch:
    inputs:
      libplacebo_version:
        description: "libplacebo git revision to build"
        required: false
        default: "3be579e6c7f6b421d9ac3ab4860edc437c50b3eb"

jobs:
  build-windows_x64-msys2:
    name: Build Windows x64 portable UG79 analogue probe v4
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p

            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Apply local controller probe v4 (temporary build checkout only)
        run: |
          python - <<'PY'
          from pathlib import Path

          cpp_path = Path('gui/src/streamsession.cpp')
          hpp_path = Path('gui/include/streamsession.h')
          cmake_path = Path('gui/CMakeLists.txt')
          cpp = cpp_path.read_text(encoding='utf-8')
          hpp = hpp_path.read_text(encoding='utf-8')
          cmake = cmake_path.read_text(encoding='utf-8')

          def change(src, old, new, count, description):
              found = src.count(old)
              if found != count:
                  raise RuntimeError(f'{description}: expected {count} exact match(es), got {found}. Refusing to patch unknown source.')
              return src.replace(old, new, count)

          hpp = change(
              hpp,
              '\t\tChiakiControllerState keyboard_state;',
              '\t\tChiakiControllerState keyboard_state;\n\t\tChiakiControllerState ug79_automation_state;',
              1, 'controller state declaration',
          )
          cpp = change(
