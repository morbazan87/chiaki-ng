      - name: Build libplacebo
        run: |
          scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: ${{ github.event.inputs.libplacebo_version }}

      - name: Setup FFmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Build SDL2 compatibility layer
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure Chiaki-ng
        run: |
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF

      - name: Build Chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Deploy portable Chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${{ github.workspace }}/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml

      - name: Add AMD Vulkan workaround launcher
        run: |
          printf '@echo off\r\nset "VK_LOADER_DRIVERS_DISABLE=*dzn*"\r\nstart "" "%%~dp0chiaki.exe"\r\n' > chiaki-ng-Win/Launch-UG79.cmd

      - name: Add only visual wall v8.1 launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          folder = Path('chiaki-ng-Win')
          folder.mkdir(exist_ok=True)
          commands = [
              '@echo off',
              'cd /d "%~dp0"',
              'set "VK_LOADER_DRIVERS_DISABLE=*dzn*"',
              'set "CHIAKI_KB_PROBE=both"',
              'set "CHIAKI_KB_DIAG_LOG=%~dp0KBPROBE-Bedrock-Wall-v8-1.log"',
              'set "CHIAKI_KB_BATCH=1"',
              'set "CHIAKI_KB_FULLCYCLE=1"',
              'set "CHIAKI_KB_SPEED_PROFILES=1"',
              'set "CHIAKI_KB_BUILD_TEST=0"',
              'set "CHIAKI_KB_AUTO_VERIFY=0"',
              'set "CHIAKI_KB_WALL_VERIFY=1"',
              'start "" "%~dp0chiaki.exe"',
          ]
          (folder / 'TEST-Bedrock-Wall-v8-1.cmd').write_bytes(
              ('\r\n'.join(commands) + '\r\n').encode('utf-8'))
          print('Created only the v8 wall calibration launcher.')
          PY

      - name: Add V8.1 visual wall instructions
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('chiaki-ng-Win/README-V8-1-WALL.txt').write_text('''CHIAKI V8.1 - PS4 BEDROCK VISUAL WALL SPEED TESTER

          Experimental; use ONLY in a disposable Creative+cheats Minecraft world.
          Stand around Y=260, look into empty sky. Be clear of any important builds.
          The tester sends /tp @s ~ ~ ~ 0 0 to set yaw and pitch 0, without
          intentionally moving your X/Y/Z location; it faces POSITIVE Z.
          It modifies blocks at Z+20, X -7..+7, Y -1..+5 relative to your position.

          1. Extract this GitHub Actions artifact to a NEW folder. Close old Chiaki apps.
          2. Launch TEST-Bedrock-Wall-v8-1.cmd; connect PS4 Remote Play and Minecraft.
          3. Keep Chiaki video visible, >=640x360 and unobscured; move the test panel aside.
          4. Close Minecraft chat / PS4 keyboard. Set reopen & Right-to-Cross delays
             in milliseconds (1ms increments), and choose 1-10 repeat batches.
          5. Press CALIBRATE WALL + RUN TIMED BATCHES. Leave player/camera untouched.

          The test aligns view, clears the tiny wall plane, captures empty sky,
          builds 8x4 colored concrete at safe 850/620 timings, captures reference,
          requires exactly 8 columns and 4 rows in the reference difference map,
          clears and validates emptiness, then runs repeated 32-command speed batches.
          Each trial's timing EXCLUDES all calibration, clearing and visual analysis.
          For every expected block, it compares video with both filled and empty
          reference pixels and reports CORRECT, MISSING or UNCERTAIN. Unclear or lost
          video NEVER counts as a pass. A keyboard REOPEN timeout triggers up to two Circle-Circle-Right-Cross recovery attempts for the current command. Other protocol errors stop safely;
          no submitted world-changing command is automatically resent. Test STOP
          never initiates a blind clean-up command.

          Outputs (beside launcher):
          KBPROBE-Bedrock-Wall-v8-1.log
          KBPROBE-Bedrock-Wall-v8-1.log.wall-recovery.csv (keyboard reopening failures)
          KBPROBE-Bedrock-Wall-v8-1.log.wall-results.csv
          KBPROBE-Bedrock-Wall-v8-1.log.wall-blocks.csv
          KBPROBE-Bedrock-Wall-v8-1.log.wall-empty.png
          KBPROBE-Bedrock-Wall-v8-1.log.wall-filled.png
          KBPROBE-Bedrock-Wall-v8-1.log.wall-last-failure.png (on failed visual trials)

          Recovery is allowed only for a keyboard-opening timeout before text was
          sent: Circle (170ms), Circle (170ms), then D-pad Right + Cross at the
          current configured timings. Up to 2 retries per command, max 12 per
          session; no submitted command is replayed. Recovery time is included
          in timed trial throughput. Other failures stop rather than resend.

          The 32 visual confirmation regions use normalized screen coordinates
          measured from a known-good 1924x1050 reference capture, not row/column
          discovery. The live filled and empty captures supply the colours.
          Keep the same camera/FOV and video layout as the reference image.
          If an expected region lacks strong block-vs-sky contrast, calibration
          stops safely; inspect the saved reference images and log.

          This is experimental and requires a new GitHub Actions build.
          Keep the first run supervised. Do not use in a valuable world.
          ''',encoding='utf-8')
          PY

      - name: Package portable prototype
        run: |
          zip -r chiaki-ng-bedrock-wall-v8-1-win64.zip chiaki-ng-Win

      - name: Upload portable prototype
        uses: actions/upload-artifact@v4
        with:
          name: chiaki-ng-bedrock-wall-v8-1-win64
          path: chiaki-ng-bedrock-wall-v8-1-win64.zip
          if-no-files-found: error
          retention-days: 7
