                      if(delta<110) continue;
                      const bool red=now.red()>155 && now.red()>now.green()*1.45 &&
                          now.red()>now.blue()*1.35;
                      const bool green=now.green()>155 && now.green()>now.red()*1.45 &&
                          now.green()>now.blue()*1.35;
                      const bool cyan=now.blue()>155 && now.green()>155 &&
                          now.blue()>now.red()*1.45 && now.green()>now.red()*1.45;
                      if((hue==0 && red) || (hue==1 && green) || (hue==2 && cyan))
                          line[x]=255;
                  }
              }
              return mask;
          }

          bool StreamSession::Ug79V7Learn(const QImage &frame, int hue)
          {
              const QImage mask=Ug79V7Mask(frame,hue);
              if(mask.isNull())return false;
              int left=mask.width(),right=-1,top=mask.height(),bottom=-1,count=0;
              for(int y=mask.height()*35/100;y<mask.height()*62/100;++y)
              {
                  const uchar *line=mask.constScanLine(y);
                  for(int x=mask.width()*25/100;x<mask.width()*75/100;++x)
                  {
                      if(!line[x])continue;
                      ++count;
                      left=qMin(left,x);right=qMax(right,x);
                      top=qMin(top,y);bottom=qMax(bottom,y);
                  }
              }
              if(count<80 || right-left<26 || bottom-top<7 ||
                 right-left>mask.width()/2 || bottom-top>mask.height()/4)return false;
              const QRect rect=QRect(QPoint(left,top),QPoint(right,bottom))
                  .adjusted(-5,-5,5,5).intersected(mask.rect());
              if(hue==2){ug79_v7_cyan_template=mask;ug79_v7_cyan_rect=rect;}
              else if(hue==1){ug79_v7_green_template=mask;ug79_v7_green_rect=rect;}
              else {ug79_v7_red_template=mask;ug79_v7_red_rect=rect;}
              return true;
          }

          bool StreamSession::Ug79V7Match(const QImage &frame, int hue) const
          {
              const QImage &reference=hue==2?ug79_v7_cyan_template:
                  (hue==1?ug79_v7_green_template:ug79_v7_red_template);
              const QRect &rect=hue==2?ug79_v7_cyan_rect:
                  (hue==1?ug79_v7_green_rect:ug79_v7_red_rect);
              if(reference.isNull() || !rect.isValid())return false;
              const QImage actual=Ug79V7Mask(frame,hue);
              if(actual.isNull() || actual.size()!=reference.size())return false;
              int expected=0,seen=0,overlap=0;
              for(int y=rect.top();y<=rect.bottom();++y)
              {
                  const uchar *referenceLine=reference.constScanLine(y);
                  const uchar *actualLine=actual.constScanLine(y);
                  for(int x=rect.left();x<=rect.right();++x)
                  {
                      const bool want=referenceLine[x]!=0,got=actualLine[x]!=0;
                      expected+=want;seen+=got;overlap+=(want&&got);
                  }
              }
              return expected>=80 && seen>=80 &&
                  overlap*100>=expected*82 && overlap*100>=seen*82;
          }

          // V7.3 keeps failure observations; only unsafe/unknown recovery ends the run.
          void StreamSession::Ug79V7Report(const QString &outcome, const QString &details)
          {
              QString clean=details;
              clean.replace(QLatin1Char(','),QLatin1Char(';'));
              clean.replace(QLatin1Char('\n'),QLatin1Char(' '));
              const qint64 elapsed=ug79_v4_clock.isValid() ? ug79_v4_clock.elapsed() : 0;
              const QString row=QStringLiteral("%1,%2,%3,%4,%5,%6,%7,%8,%9")
                  .arg(QDateTime::currentDateTimeUtc().toString(Qt::ISODateWithMs))
                  .arg(ug79_v7_mode).arg(ug79_v7_cursor+1)
                  .arg(ug79_v5_reopen_delay_ms).arg(ug79_v5_right_cross_delay_ms)
                  .arg(elapsed).arg(ug79_batch_index).arg(outcome).arg(clean);
              ug79_v7_rows << row;
              const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG")+QStringLiteral(".v7-3-results.csv");
              QFile out(path);
              if(out.open(QIODevice::WriteOnly|QIODevice::Append|QIODevice::Text))
              {
                  if(out.size()==0)
                      out.write("utc,stage,trial,reopen_ms,right_cross_ms,elapsed_ms,protocol_commands,outcome,reason\n");
                  out.write((row+QStringLiteral("\n")).toUtf8());
              }
              // Single pass is a candidate, NOT evidence of guaranteed reliability.
              if(outcome==QStringLiteral("PASS"))
              {
                  ug79_v7_good_pairs.append(qMakePair(ug79_v5_reopen_delay_ms,ug79_v5_right_cross_delay_ms));
                  ug79_v7_good_times.append(elapsed);
              }
          }

          bool StreamSession::Ug79V7LooksLikeGameplay() const
          {
              const QImage now=Ug79V7Capture();
              if(now.isNull())
              {ug79_v7_recovery_diag=QStringLiteral("no_video");return false;}
              if(now.size()!=ug79_v7_baseline.size())
              {ug79_v7_recovery_diag=QStringLiteral("video_dimensions_changed");return false;}
              if(ug79_batch_keyboard_open)
              {ug79_v7_recovery_diag=QStringLiteral("native_keyboard_open");return false;}
              // Two stable HUD features: crosshair and hotbar, NOT changing scenery.
              // Correlate gradient edges, not raw brightness: reject missing HUD/menu.
              const QRect regions[2]={
                  QRect(now.width()*47/100,now.height()*47/100,
                        now.width()*6/100,now.height()*6/100),
                  QRect(now.width()*32/100,now.height()*90/100,
                        now.width()*36/100,now.height()*8/100)
              };
              QString diagnostic;
              for(int k=0;k<2;++k)
              {
                  const QRect rect=regions[k].intersected(now.rect().adjusted(0,0,-3,-3));
                  int expected=0,matched=0;
                  for(int y=rect.top();y<rect.bottom();y+=2)
                      for(int x=rect.left();x<rect.right();x+=2)
                      {
                          const QColor a(now.pixel(x,y)),ar(now.pixel(x+2,y)),ad(now.pixel(x,y+2));
                          const QColor b(ug79_v7_baseline.pixel(x,y));
                          const QColor br(ug79_v7_baseline.pixel(x+2,y));
                          const QColor bd(ug79_v7_baseline.pixel(x,y+2));
                          const int al=(a.red()*3+a.green()*6+a.blue())/10;
                          const int arl=(ar.red()*3+ar.green()*6+ar.blue())/10;
                          const int adl=(ad.red()*3+ad.green()*6+ad.blue())/10;
                          const int bl=(b.red()*3+b.green()*6+b.blue())/10;
                          const int brl=(br.red()*3+br.green()*6+br.blue())/10;
                          const int bdl=(bd.red()*3+bd.green()*6+bd.blue())/10;
                          const int baseEdge=qAbs(bl-brl)+qAbs(bl-bdl);
                          if(baseEdge<65)continue;
                          ++expected;
                          const int observedEdge=qAbs(al-arl)+qAbs(al-adl);
                          if(observedEdge>=50 && qAbs(observedEdge-baseEdge)<135)++matched;
                      }
                  const int pct=expected?100*matched/expected:0;
                  diagnostic+=QStringLiteral("%1_edges=%2/%3(%4pct);")
                      .arg(k==0?QStringLiteral("crosshair"):QStringLiteral("hotbar"))
                      .arg(matched).arg(expected).arg(pct);
                  if(expected<8 || pct<60)
                  {ug79_v7_recovery_diag=diagnostic;return false;}
              }
              ug79_v7_recovery_diag=diagnostic;
              return true;
          }

          void StreamSession::Ug79V7Halt(const QString &reason)
          {
              if(!ug79_v7_running)return;
              ug79_v7_running=false;
              ug79_v7_stage=0;
              ug79_v7_recovering=false;
              if(ug79_batch_active)
                  Ug79BatchStop(QStringLiteral("V7.3 automatic test halted: ")+reason);
              if(ug79_v7_status)
                  ug79_v7_status->setText(QStringLiteral("AUTO TEST ENDED: ")+reason+
                      QStringLiteral(". Results: KBPROBE-*.log.v7-3-results.csv"));
              if(ug79_v5_profile_selector)
                  ug79_v5_profile_selector->setEnabled(true);
              Ug79V4Log("V7_3_FINISHED");
          }

          // Generate coarse grid, adaptive 1ms local sweeps and repeated confirmation.
          void StreamSession::Ug79V7BuildPlan(int mode)
          {
              ug79_v7_mode=mode;
              ug79_v7_cursor=0;
              ug79_v7_plan.clear();
              if(mode==0)
              {
                  // P2 first. Broader reopen delays included: P2 is not always repeatable.
                  const int reopen[]={400,350,300,450,500,600,700,850};
                  const int cross[]={620,580,540,500,460,420,400,380,350,320,300};
                  for(int r:reopen)
                      for(int p:cross)
                          ug79_v7_plan.append(qMakePair(r,p));
              }
              else if(mode==1 || mode==2)
              {
                  // Choose the fastest GAME-VERIFIED profile observed so far.
                  int best=-1;
                  for(int i=0;i<ug79_v7_good_pairs.size();++i)
                      if(best<0 || ug79_v7_good_times.at(i)<ug79_v7_good_times.at(best))best=i;
                  if(best<0)
                  {
                      // No positive examples; still give complete coarse failure report.
                      Ug79V7Halt(QStringLiteral("coarse scan completed with no verified PASS; no fine scan is safe"));
                      return;
                  }
                  const auto pair=ug79_v7_good_pairs.at(best);
                  const int center=mode==1 ? pair.second : pair.first;
                  // Precisely 1ms requested increments; actual Qt/Windows jitter is logged.
                  for(int n=qMax(250,center-15);n<=center+15;++n)
                      ug79_v7_plan.append(mode==1?qMakePair(pair.first,n):qMakePair(n,pair.second));
              }
              else if(mode==3)
              {
                  // Confirm the three fastest distinct GAME-VERIFIED candidates.
                  QVector<int> indices;
                  for(int i=0;i<ug79_v7_good_pairs.size();++i)
                  {
                      bool duplicate=false;
                      for(int index:indices)
                          if(ug79_v7_good_pairs.at(index)==ug79_v7_good_pairs.at(i))duplicate=true;
                      if(!duplicate)indices.append(i);
                  }
                  std::sort(indices.begin(),indices.end(),[this](int a,int b){
                      return ug79_v7_good_times.at(a)<ug79_v7_good_times.at(b);
                  });
                  for(int k=0;k<qMin(3,int(indices.size()));++k)
                  {
                      const int reps=k==0?24:12;
                      for(int i=0;i<reps;++i)ug79_v7_plan.append(ug79_v7_good_pairs.at(indices.at(k)));
                  }
              }
              if(ug79_v7_plan.isEmpty())
              {
                  Ug79V7Halt(QStringLiteral("scan complete; no eligible confirmation candidates"));
                  return;
              }
              Ug79V4Log("V7_3_SCAN_STAGE_START");
              QTimer::singleShot(450,this,[this](){if(ug79_v7_running)Ug79V7Trial();});
          }

          void StreamSession::Ug79V7Next()
          {
              if(!ug79_v7_running)return;
              ug79_v7_recovering=false;
              ug79_v7_recovery_attempts=0;
              ++ug79_v7_cursor;
              if(ug79_v7_cursor<ug79_v7_plan.size())
              {
                  QTimer::singleShot(600,this,[this](){if(ug79_v7_running)Ug79V7Trial();});
                  return;
              }
              if(ug79_v7_mode<3)
                  Ug79V7BuildPlan(ug79_v7_mode+1);
              else
                  Ug79V7Halt(QStringLiteral("COMPLETE: coarse, 1ms sweeps, repeated confirmations finished; analyse results CSV"));
          }

          void StreamSession::Ug79V7Recover()
          {
              if(!ug79_v7_running || !ug79_v7_recovering)return;
              if(!connected)
              {
                  Ug79V7Halt(QStringLiteral("Remote Play disconnected; remaining settings not sent"));
                  return;
              }
              if(ug79_v7_recovery_attempts>=3)
              {
                  const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
                  if(!path.isEmpty())Ug79V7Capture().save(path+QStringLiteral(".v7-3-recovery-last.png"),"PNG");
                  Ug79V7Report(QStringLiteral("UNSAFE_STOP"),
                      QStringLiteral("three recovery checks failed: ")+ug79_v7_recovery_diag+
                      QStringLiteral("; remaining tests not sent"));
                  Ug79V7Halt(QStringLiteral("gameplay state could not be safely recovered"));
                  return;
              }
              ++ug79_v7_recovery_attempts;
              // Never retry or submit a failed world-changing command.
              // Reject the native PS keyboard if present, then dismiss chat with Circle.
              if(ug79_batch_keyboard_open)
                  chiaki_session_keyboard_reject(&session);
              ++ug79_batch_stage_token; // invalidate leftover controller/timer callbacks
              chiaki_controller_state_set_idle(&ug79_automation_state);
              ug79_automation_state.buttons=CHIAKI_CONTROLLER_BUTTON_MOON;
              SendFeedbackState();
              QTimer::singleShot(175,this,[this]() {
                  chiaki_controller_state_set_idle(&ug79_automation_state);
                  if(connected)SendFeedbackState();
                  QTimer::singleShot(1100,this,[this]() {
                      if(!ug79_v7_running || !ug79_v7_recovering)return;
                      const bool gameplay=Ug79V7LooksLikeGameplay();
                      Ug79V4Log((QStringLiteral("V7_3_RECOVERY_HUD_CHECK ")+ug79_v7_recovery_diag).toUtf8().constData());
                      if(gameplay)
                      {
                          ug79_v7_recovery_fail_streak=0;
                          Ug79V4Log("V7_3_RECOVERY_GAMEPLAY_CONFIRMED");
                          ug79_v7_recovering=false;
                          if(ug79_v7_stage!=4)
                              QTimer::singleShot(650,this,[this](){if(ug79_v7_running)Ug79V7Control(1);});
                          else Ug79V7Next();
                      }
                      else
                      {
                          Ug79V4Log("V7_3_RECOVERY_NOT_CONFIRMED");
                          QTimer::singleShot(800,this,[this](){Ug79V7Recover();});
                      }
                  });
              });
          }

          void StreamSession::Ug79V7OnProtocolFailure(const QString &reason)
          {
              if(!ug79_v7_running)return;
              if(ug79_v7_stage!=4)
              {
                  ++ug79_v7_calibration_retries;
                  Ug79V4Log("V7_3_CALIBRATION_PROTOCOL_FAILED");
                  if(ug79_v7_calibration_retries>3)
                  {
                      Ug79V7Halt(QStringLiteral("calibration failed repeatedly: ")+reason);
                      return;
                  }
                  ug79_v7_recovering=true;
                  QTimer::singleShot(900,this,[this](){Ug79V7Recover();});
                  return;
              }
              Ug79V7Report(QStringLiteral("PROTOCOL_FAIL"),reason);
              Ug79V4Log("V7_3_TRIAL_FAILED_CONTINUING");
              ug79_v7_recovering=true;
              ++ug79_v7_recovery_fail_streak;
              // Save diagnostic evidence once per failure, not every normal frame.
              const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
              if(!path.isEmpty())Ug79V7Capture().save(path+QStringLiteral(".v7-3-failure.png"),"PNG");
              if(ug79_v7_status)
                  ug79_v7_status->setText(QStringLiteral("Recorded failure at %1/%2 ms; recovering for next profile")
                      .arg(ug79_v5_reopen_delay_ms).arg(ug79_v5_right_cross_delay_ms));
              QTimer::singleShot(900,this,[this](){Ug79V7Recover();});
          }

          void StreamSession::Ug79V7Start()
          {
              if(qEnvironmentVariable("CHIAKI_KB_AUTO_VERIFY")!=QStringLiteral("1") ||
                 !connected || ug79_batch_active || ug79_batch_keyboard_open || ug79_v7_running)
                  return;
              const QImage frame=Ug79V7Capture();
              if(frame.width()<640 || frame.height()<360)
              {
                  if(ug79_v7_status)ug79_v7_status->setText(QStringLiteral("No readable Minecraft stream. Nothing sent."));
                  return;
              }
              const QColor a(frame.pixel(frame.width()/4,frame.height()/4));
              const QColor b(frame.pixel(frame.width()/2,frame.height()/2));
              const QColor c(frame.pixel(frame.width()*3/4,frame.height()*3/4));
              if(a==b && b==c)
              {
                  if(ug79_v7_status)ug79_v7_status->setText(QStringLiteral("Blank stream capture. Nothing sent."));
                  return;
              }
              ug79_v7_baseline=frame;
              ug79_v7_green_template=QImage();
              ug79_v7_cyan_template=QImage();
              ug79_v7_red_template=QImage();
              ug79_v7_running=true;
              ug79_v7_stage=0;
              ug79_v7_mode=0;
              ug79_v7_cursor=0;
              ug79_v7_trial_start_ms=0;
              ug79_v7_recovering=false;
              ug79_v7_recovery_attempts=0;
              ug79_v7_recovery_fail_streak=0;
              ug79_v7_calibration_retries=0;
              ug79_v7_good_pairs.clear();
              ug79_v7_good_times.clear();
              ug79_v7_rows.clear();
              ug79_v7_green=ug79_v7_red=ug79_v7_uncertain=0;
              if(ug79_v7_status)
                  ug79_v7_status->setText(QStringLiteral("Calibrating Bedrock red/green/red controls before autonomous scan..."));
              Ug79V4Log("V7_CALIBRATION_STARTED");
              QTimer::singleShot(350,this,[this](){if(ug79_v7_running)Ug79V7Control(1);});
          }

          void StreamSession::Ug79V7Control(int stage)
          {
              if(!ug79_v7_running || !connected || ug79_batch_active || ug79_batch_keyboard_open)
              {
                  Ug79V7Halt(QStringLiteral("calibration failed: keyboard/batch/connection not ready"));
                  return;
              }
              ug79_v7_stage=stage;
              const QString title=stage==2 ? QStringLiteral("/title @s title \u00a7aPASS") :
                  (stage==5 ? QStringLiteral("/title @s title \u00a7bPASS")
                            : QStringLiteral("/title @s title \u00a7cFAIL"));
              ug79_batch_commands=QStringList{QStringLiteral("/title @s clear"),
                                              QStringLiteral("/title @s times 0 100 0"),title};
              for(const QString &cmd:ug79_batch_commands)
                  if(cmd.toUtf8().size()>80)
                  {
                      Ug79V7Halt(QStringLiteral("calibration command exceeds 80 bytes"));return;
                  }
              ug79_v5_reopen_delay_ms=400;
              ug79_v5_right_cross_delay_ms=620;
              ug79_v5_profile_name=QStringLiteral("V7_CALIBRATION_%1").arg(stage);
              if(ug79_v5_profile_selector)ug79_v5_profile_selector->setEnabled(false);
              ug79_batch_index=0;
              ug79_batch_active=true;
              ug79_v4_clock.start();
              if(ug79_v7_status)
                  ug79_v7_status->setText(QStringLiteral("Calibrating red / green / red / cyan control %1...").arg(stage));
              Ug79V4Log("V7_CALIBRATION_CONTROL");
              Ug79BatchSetPhase(5,0);
              Ug79BatchReopen();
          }

          void StreamSession::Ug79V7ControlObserve()
          {
              if(!ug79_v7_running || !connected || ug79_batch_active)return;
              const QImage current=Ug79V7Capture();
              if(current.isNull() || current.size()!=ug79_v7_baseline.size())
              {
                  Ug79V7Halt(QStringLiteral("screen changed during calibration"));return;
              }
              if(ug79_v7_stage==1)
              {
                  if(!Ug79V7Learn(current,false))
                  { Ug79V7Halt(QStringLiteral("RED FAIL control not readable"));return; }
                  QTimer::singleShot(350,this,[this](){if(ug79_v7_running)Ug79V7Control(2);});
              }
              else if(ug79_v7_stage==2)
              {
                  if(!Ug79V7Learn(current,true) || !Ug79V7Match(current,true))
                  { Ug79V7Halt(QStringLiteral("GREEN PASS control not readable"));return; }
                  QTimer::singleShot(350,this,[this](){if(ug79_v7_running)Ug79V7Control(3);});
              }
              else if(ug79_v7_stage==3)
              {
                  if(!Ug79V7Match(current,0) || Ug79V7Match(current,1))
                  { Ug79V7Halt(QStringLiteral("negative control failed"));return; }
                  QTimer::singleShot(350,this,[this](){if(ug79_v7_running)Ug79V7Control(5);});
              }
              else if(ug79_v7_stage==5)
              {
                  if(!Ug79V7Learn(current,2) || !Ug79V7Match(current,2) ||
                     Ug79V7Match(current,1) || Ug79V7Match(current,0))
                  { Ug79V7Halt(QStringLiteral("CYAN control not readable or ambiguous"));return; }
                  ug79_v7_stage=4;
                  Ug79V4Log("V7_3_THREE_COLOUR_CALIBRATION_PASSED");
                  Ug79V7BuildPlan(0);
              }
              else Ug79V7Halt(QStringLiteral("internal calibration stage invalid"));
          }

          void StreamSession::Ug79V7Trial()
          {
              if(!ug79_v7_running || ug79_v7_stage!=4 || !connected ||
                 ug79_batch_active || ug79_batch_keyboard_open || ug79_v7_recovering)
              {
                  Ug79V7Halt(QStringLiteral("unsafe or invalid state before trial"));return;
              }
              if(ug79_v7_cursor>=ug79_v7_plan.size())return;
              const auto p=ug79_v7_plan.at(ug79_v7_cursor);
              static const QString palette[]={
                  QStringLiteral("lime_concrete"),QStringLiteral("blue_concrete"),
                  QStringLiteral("yellow_concrete"),QStringLiteral("pink_concrete")};
              const QString block=palette[(ug79_v7_cursor+ug79_v7_mode*2)%4];
              QStringList commands;
              commands << QStringLiteral("/title @s clear");
              commands << QStringLiteral("/fill ~2 ~-3 ~2 ~9 ~-3 ~5 ")+block;
              commands << QStringLiteral("/fill ~2 ~-2 ~2 ~9 ~-2 ~5 air");
              for(int z=2;z<=5;++z)
                  for(int x=2;x<=9;++x)
                      commands << QStringLiteral("/setblock ~%1 ~-2 ~%2 %3").arg(x).arg(z).arg(block);
              commands << QStringLiteral("/title @s title \u00a7cFAIL");
              // Two independently calibrated colour challenges. Not full numeric OCR.
              ug79_v7_expect_cyan=((ug79_v7_cursor+ug79_v7_mode*101)%2)==1;
              commands << QStringLiteral(
                  "/execute if blocks ~2 ~-3 ~2 ~9 ~-3 ~5 ~2 ~-2 ~2 all run title @s title \u00a7")
                  + (ug79_v7_expect_cyan?QStringLiteral("bPASS"):QStringLiteral("aPASS"));
              if(commands.size()!=37)
              { Ug79V7Halt(QStringLiteral("generator error: unexpected command count"));return; }
              for(const QString &cmd:commands)
                  if(cmd.toUtf8().size()>80)
                  { Ug79V7Halt(QStringLiteral("generated command >80 UTF-8 bytes"));return; }
              ug79_v5_reopen_delay_ms=p.first;
              ug79_v5_right_cross_delay_ms=p.second;
              ug79_v5_profile_name=QStringLiteral("V7_3_stage%1_%2_%3_trial%4")
                  .arg(ug79_v7_mode).arg(p.first).arg(p.second).arg(ug79_v7_cursor+1);
              if(ug79_v5_profile_selector)ug79_v5_profile_selector->setEnabled(false);
              ug79_v7_green=ug79_v7_red=ug79_v7_uncertain=0;
              ug79_batch_commands=commands;
              ug79_batch_index=0;
              ug79_batch_active=true;
              ug79_v7_trial_start_ms=QDateTime::currentMSecsSinceEpoch();
              ug79_v4_clock.start();
              if(ug79_v7_status)
                  ug79_v7_status->setText(QStringLiteral("Stage %1, %2/%3: %4/%5 ms; %6 PASS candidates")
                      .arg(ug79_v7_mode).arg(ug79_v7_cursor+1).arg(ug79_v7_plan.size())
                      .arg(p.first).arg(p.second).arg(ug79_v7_good_pairs.size()));
              Ug79V4Log("V7_3_TRIAL_STARTED");
              Ug79BatchSetPhase(5,0);
              Ug79BatchReopen();
          }

          void StreamSession::Ug79V7Observe()
          {
              if(!ug79_v7_running || !connected || ug79_batch_active || ug79_v7_stage!=4)return;
              const QImage current=Ug79V7Capture();
              if(current.isNull() || current.size()!=ug79_v7_baseline.size())
              {
                  Ug79V7Report(QStringLiteral("VISUAL_FAIL"),QStringLiteral("screen lost or resized"));
                  Ug79V7Halt(QStringLiteral("video unavailable; cannot safely score remaining trials"));
                  return;
              }
              const bool pass=Ug79V7Match(current,ug79_v7_expect_cyan?2:1);
              const bool wrong=Ug79V7Match(current,ug79_v7_expect_cyan?1:2);
              const bool fail=Ug79V7Match(current,0);
              if(fail || wrong || !pass)
              {
                  const QString path=qEnvironmentVariable("CHIAKI_KB_DIAG_LOG");
                  if(!path.isEmpty())current.save(path+QStringLiteral(".v7-3-failure.png"),"PNG");
                  Ug79V7Report(fail?QStringLiteral("GAME_FAIL"):
                      (wrong?QStringLiteral("RECEIPT_MISMATCH"):QStringLiteral("VISUAL_INCONCLUSIVE")),
                      fail?QStringLiteral("Minecraft FAIL glyph"):
                      (wrong?QStringLiteral("wrong receipt colour; possible stale PASS"):
                             QStringLiteral("expected receipt not verified")));
                  Ug79V4Log("V7_3_GAME_FAILED_CONTINUING");
                  // A recognized game FAIL can advance; unknown images need safe recovery.
                  if(fail)Ug79V7Next();
                  else
                  {
                      ug79_v7_recovering=true;
                      QTimer::singleShot(500,this,[this](){Ug79V7Recover();});
                  }
                  return;
              }
              ++ug79_v7_green;
              if(ug79_v7_green<3)
              {
                  QTimer::singleShot(220,this,[this](){if(ug79_v7_running)Ug79V7Observe();});
                  return;
              }
              Ug79V7Report(QStringLiteral("PASS"),ug79_v7_expect_cyan?
                  QStringLiteral("three CYAN receipt samples and full keyboard protocol"):
                  QStringLiteral("three GREEN receipt samples and full keyboard protocol"));
              Ug79V4Log("V7_3_GAME_VERIFIED_PASS");
              Ug79V7Next();
          }

