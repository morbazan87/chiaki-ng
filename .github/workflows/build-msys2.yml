          // Extract the relevant changed red or green title glyph pixels, not all
          // green pixels in the scene. The centre crop rejects peripheral scenery/UI.
          QImage StreamSession::Ug79V7Mask(const QImage &frame, int hue) const
          {
              if(frame.isNull() || frame.size()!=ug79_v7_baseline.size()) return QImage();
              QImage mask(frame.size(),QImage::Format_Grayscale8);
              mask.fill(0);
              for(int y=frame.height()*35/100;y<frame.height()*62/100;++y)
              {
                  uchar *line=mask.scanLine(y);
                  for(int x=frame.width()*25/100;x<frame.width()*75/100;++x)
                  {
                      const QColor now(frame.pixel(x,y));
                      const QColor old(ug79_v7_baseline.pixel(x,y));
                      const int delta=qAbs(now.red()-old.red())+qAbs(now.green()-old.green())+
