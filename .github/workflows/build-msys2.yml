          bool StreamSession::Ug79V7Learn(const QImage &frame, bool green)
          {
              const QImage mask=Ug79V7Mask(frame,green);
              if(mask.isNull())return false;
              int left=mask.width(),right=-1,top=mask.height(),bottom=-1,count=0;
              for(int y=mask.height()*35/100;y<mask.height()*62/100;++y)
              {
                  const uchar *line=mask.constScanLine(y);
                  for(int x=mask.width()*25/100;x<mask.width()*75/100;++x)
                  {
                      if(!line[x])continue;
                      ++count;
                      left=qMin(left,x);right=qMax(right,x);
                      top=qMin(top,y);bottom=qMax(bottom,y);
                  }
              }
              // Require a real, compact word-shaped signature. A few coloured pixels
              // or an entire coloured game scene is not an acceptable calibration.
              if(count<80 || right-left<26 || bottom-top<7 ||
                 right-left>mask.width()/2 || bottom-top>mask.height()/4)
                  return false;
              const QRect rect=QRect(QPoint(left,top),QPoint(right,bottom))
                  .adjusted(-5,-5,5,5).intersected(mask.rect());
              if(green)
              {
                  ug79_v7_green_template=mask;
                  ug79_v7_green_rect=rect;
              }
              else
              {
                  ug79_v7_red_template=mask;
                  ug79_v7_red_rect=rect;
              }
              return true;
          }

          bool StreamSession::Ug79V7Match(const QImage &frame, bool green) const
          {
              const QImage &reference=green ? ug79_v7_green_template:ug79_v7_red_template;
              const QRect &rect=green ? ug79_v7_green_rect:ug79_v7_red_rect;
              if(reference.isNull() || !rect.isValid())return false;
              const QImage actual=Ug79V7Mask(frame,green);
              if(actual.isNull() || actual.size()!=reference.size())return false;
              int expected=0,seen=0,overlap=0;
              for(int y=rect.top();y<=rect.bottom();++y)
              {
                  const uchar *t=reference.constScanLine(y);
                  const uchar *a=actual.constScanLine(y);
                  for(int x=rect.left();x<=rect.right();++x)
                  {
                      const bool want=t[x]!=0,got=a[x]!=0;
                      expected+=want;seen+=got;overlap+=(want && got);
                  }
              }
              // Both sensitivity and specificity: background green alone won't match
              // the calibrated shape of the word PASS. Reject partial/occluded titles.
              return expected>=80 && seen>=80 &&
                     overlap*100>=expected*82 && overlap*100>=seen*82;
          }

