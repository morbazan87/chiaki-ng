          def replace_once(src, old, new, desc):
              if old == new: raise RuntimeError(desc + ' identical strings')
              if src.count(old)==1:
                  print('Fullcycle v4 patch verified:', desc)
                  return src.replace(old,new,1)
              # Accept changing only indentation across Windows checkout; no fuzzy
              # content substitution allowed (fail closed on missing anchors).
              expr=''
              for line in old.splitlines(keepends=True):
                  content=line.rstrip('\r\n').strip()
                  has_eol=line.endswith('\n')
                  expr += (r'^[ \t]*'+re.escape(content) if content else r'^[ \t]*')
                  if has_eol:expr+='\n'
              matches=list(re.finditer(expr,src,re.MULTILINE))
              if len(matches)!=1:
                  raise RuntimeError(f'Fullcycle v4 {desc}: expected one exact or indentation-normalized anchor, found {len(matches)}')
              m=matches[0]
