          cpp=replace_once(cpp,'void StreamSession::Ug79BatchStop(const QString &reason)',
              r'''// V7.1: calibrated Bedrock title classifier, fail closed on uncertain video.
          // The game itself decides PASS with /execute if blocks; this classifier only
          // determines whether the expected Minecraft title glyphs were actually shown.
          // No screenshot, text or telemetry is uploaded anywhere.
          QImage StreamSession::Ug79V7Capture() const
          {
              QWindow *best = nullptr;
              qint64 bestArea = 0;
