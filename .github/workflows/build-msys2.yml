name: Build Chiaki-ng Windows - Multi-Speed Native Text v5

on:
  workflow_dispatch:
    inputs:
      libplacebo_version:
        description: "libplacebo git revision to build"
        required: false
        default: "3be579e6c7f6b421d9ac3ab4860edc437c50b3eb"

jobs:
  build-windows_x64-msys2:
    name: Build Windows x64 Multi-Speed Native Text v5
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p

            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install Python protobuf and zip
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Apply local controller probe v7 (temporary build checkout only)
        run: |
          python - <<'PY'
          from pathlib import Path

          cpp_path = Path('gui/src/streamsession.cpp')
          hpp_path = Path('gui/include/streamsession.h')
          cmake_path = Path('gui/CMakeLists.txt')
          cpp = cpp_path.read_text(encoding='utf-8')
          hpp = hpp_path.read_text(encoding='utf-8')
          cmake = cmake_path.read_text(encoding='utf-8')

          def change(src, old, new, count, description):
              found = src.count(old)
              if found != count:
                  raise RuntimeError(f'{description}: expected {count} exact match(es), got {found}. Refusing to patch unknown source.')
              return src.replace(old, new, count)

          hpp = change(
              hpp,
              '\t\tChiakiControllerState keyboard_state;',
              '\t\tChiakiControllerState keyboard_state;\n\t\tChiakiControllerState ug79_automation_state;\n\t\tChiakiControllerState ug79_touch_state;\n\t\tint8_t ug79_touch_id = -1;\n\t\tQMutex ug79_frame_mutex;\n\t\tbool ug79_frame_pending = false;\n\t\tQString ug79_frame_label;\n\t\tQString ug79_frame_result = QStringLiteral("NO_FRAME");',
              1, 'controller state declaration',
          )
          cpp = change(
              cpp,
              '#include <QKeyEvent>',
              '#include <QKeyEvent>\n#include <QTcpServer>\n#include <QTcpSocket>\n#include <QHostAddress>\n#include <QDebug>\n#include <QDir>\n#include <QDateTime>\n#include <QStandardPaths>',
              1, 'Qt Network headers',
          )
          cpp = change(
              cpp,
              '\tchiaki_controller_state_set_idle(&keyboard_state);',
              '\tchiaki_controller_state_set_idle(&keyboard_state);\n\tchiaki_controller_state_set_idle(&ug79_automation_state);\n\tchiaki_controller_state_set_idle(&ug79_touch_state);\n\tug79_touch_id = -1;',
              3, 'initial controller state',
          )
          cpp = change(
              cpp,
              '\tchiaki_controller_state_or(&state, &state, &touch_state);',
              '\tchiaki_controller_state_or(&state, &state, &touch_state);\n\tchiaki_controller_state_or(&state, &state, &ug79_automation_state);\n\tchiaki_controller_state_or(&state, &state, &ug79_touch_state);',
              2, 'both controller send paths',
          )


          hpp = change(
              hpp,
              '\t\tvoid HandleKeyboardEvent(QKeyEvent *event);',
              '\t\tbool QueueCalibrationFrame(const QString &label);\n'
              '\t\tbool TakeCalibrationFrameRequest(QString *label);\n'
              '\t\tvoid SetCalibrationFrameResult(const QString &result);\n'
              '\t\tQString GetCalibrationFrameResult();\n'
              '\t\tvoid HandleKeyboardEvent(QKeyEvent *event);',
              1, 'frame-request public methods',
          )

          frame_methods = r'''bool StreamSession::QueueCalibrationFrame(const QString &label)
          {
              QMutexLocker lock(&ug79_frame_mutex);
              if(ug79_frame_pending)
                  return false;
              ug79_frame_label = label;
              ug79_frame_pending = true;
              ug79_frame_result = QStringLiteral("PENDING ") + label;
              return true;
          }

          bool StreamSession::TakeCalibrationFrameRequest(QString *label)
          {
              QMutexLocker lock(&ug79_frame_mutex);
              if(!ug79_frame_pending)
                  return false;
              *label = ug79_frame_label;
              ug79_frame_pending = false;
              return true;
          }

          void StreamSession::SetCalibrationFrameResult(const QString &result)
          {
              QMutexLocker lock(&ug79_frame_mutex);
              ug79_frame_result = result;
          }

          QString StreamSession::GetCalibrationFrameResult()
          {
              QMutexLocker lock(&ug79_frame_mutex);
              return ug79_frame_result;
          }

          '''
          cpp = change(
              cpp,
              'void StreamSession::HandleKeyboardEvent(QKeyEvent *event)',
              frame_methods + 'void StreamSession::HandleKeyboardEvent(QKeyEvent *event)',
              1, 'frame capture request methods',
          )

          server_code = r'''    // Build #7: localhost-only controller automation with adjustable press duration.
              // Every command automatically releases its input when the timer expires.
              auto *ug79_pulse_timer = new QTimer(this);
              ug79_pulse_timer->setSingleShot(true);
              ug79_pulse_timer->setTimerType(Qt::PreciseTimer);
              connect(ug79_pulse_timer, &QTimer::timeout, this, [this]() {
                  chiaki_controller_state_set_idle(&ug79_automation_state);
                  if(connected)
                      SendFeedbackState();
              });

              auto *ug79_server = new QTcpServer(this);
              connect(ug79_server, &QTcpServer::newConnection, this,
                  [this, ug79_server, ug79_pulse_timer]() {
                  while(ug79_server->hasPendingConnections())
                  {
                      auto *client = ug79_server->nextPendingConnection();
                      client->setReadBufferSize(128);
                      connect(client, &QTcpSocket::disconnected, client, &QObject::deleteLater);
                      connect(client, &QTcpSocket::readyRead, this,
                          [this, client, ug79_pulse_timer]() {
                          if(client->bytesAvailable() > 64)
                          {
                              client->write("ERR command too long\n");
                              client->disconnectFromHost();
                              return;
                          }
                          if(!client->canReadLine())
                              return;
                          const QByteArray command = client->readLine(65).trimmed().toUpper().simplified();
                          if(command == "PING")
                              client->write(connected ? "READY\n" : "NOT_CONNECTED\n");
                          else if(command == "STOP")
                          {
                              ug79_pulse_timer->stop();
                              chiaki_controller_state_set_idle(&ug79_automation_state);
                              chiaki_controller_state_set_idle(&ug79_touch_state);
                              ug79_touch_id = -1;
                              if(connected)
                                  SendFeedbackState();
                              client->write("STOPPED\n");
                          }
                          else if(command == "FRAME STATUS")
                          {
                              client->write(GetCalibrationFrameResult().toUtf8() + "\n");
                          }
                          else if(command.startsWith("FRAME "))
                          {
                              const QByteArray label = command.mid(6).trimmed();
                              bool valid = !label.isEmpty() && label.size() <= 12;
                              for(char c : label)
                                  if(!((c >= 'A' && c <= 'Z') || (c >= '0' && c <= '9') || c == '_'))
                                      valid = false;
                              if(!connected)
                                  client->write("ERR not connected\n");
                              else if(!valid)
                                  client->write("ERR label must be 1..12 letters, digits or underscores\n");
                              else if(!QueueCalibrationFrame(QString::fromLatin1(label)))
                                  client->write("ERR frame request pending\n");
                              else
                                  client->write("QUEUED " + label + "\n");
                          }
                          else if(command.startsWith("TOUCH "))
                          {
                              const auto touch_parts = command.split(' ');
                              const QByteArray op = touch_parts.size() > 1 ? touch_parts.at(1) : QByteArray();
                              if(!connected)
                                  client->write("ERR not connected\n");
                              else if(op == "STATUS" && touch_parts.size() == 2)
                                  client->write(ug79_touch_id >= 0 ? "TOUCH ACTIVE\n" : "TOUCH RELEASED\n");
                              else if(op == "END" && touch_parts.size() == 2)
                              {
                                  if(ug79_touch_id >= 0)
                                      chiaki_controller_state_stop_touch(&ug79_touch_state, (uint8_t)ug79_touch_id);
                                  ug79_touch_id = -1;
                                  SendFeedbackState();
                                  client->write("TOUCH RELEASED\n");
                              }
                              else if((op == "BEGIN" || op == "MOVE") && touch_parts.size() == 4)
                              {
                                  bool ok_x = false, ok_y = false;
                                  const int x = touch_parts.at(2).toInt(&ok_x);
                                  const int y = touch_parts.at(3).toInt(&ok_y);
                                  if(!ok_x || !ok_y || x < 0 || y < 0 || x > (int)PS_TOUCHPAD_MAX_X || y > (int)PS_TOUCHPAD_MAX_Y)
                                      client->write("ERR touch coordinates outside touchpad\n");
                                  else if(op == "BEGIN")
                                  {
                                      if(ug79_touch_id >= 0)
                                          client->write("ERR touch already held (use MOVE or END)\n");
                                      else
                                      {
                                          ug79_touch_id = chiaki_controller_state_start_touch(&ug79_touch_state, (uint16_t)x, (uint16_t)y);
                                          if(ug79_touch_id < 0)
                                              client->write("ERR no free touch slot\n");
                                          else
                                          {
                                              SendFeedbackState();
                                              client->write("TOUCH HELD\n");
                                          }
                                      }
                                  }
                                  else if(ug79_touch_id < 0)
                                      client->write("ERR touch not held (use BEGIN)\n");
                                  else
                                  {
                                      chiaki_controller_state_set_touch_pos(&ug79_touch_state, (uint8_t)ug79_touch_id, (uint16_t)x, (uint16_t)y);
                                      SendFeedbackState();
                                      client->write("TOUCH MOVED\n");
                                  }
                              }
                              else
                                  client->write("ERR use TOUCH BEGIN x y, TOUCH MOVE x y, TOUCH END, TOUCH STATUS\n");
                          }
                          else
                          {
                              const auto parts = command.split(' ');
                              const QByteArray action = parts.at(0);
                              uint32_t button = 0;
                              // Retain all Build #5 raw commands and gameplay aliases.
                              if(action == "UP" || action == "PERSPECTIVE") button = CHIAKI_CONTROLLER_BUTTON_DPAD_UP;
                              else if(action == "DOWN" || action == "DROP") button = CHIAKI_CONTROLLER_BUTTON_DPAD_DOWN;
                              else if(action == "LEFT" || action == "EMOTE") button = CHIAKI_CONTROLLER_BUTTON_DPAD_LEFT;
                              else if(action == "RIGHT" || action == "CHAT") button = CHIAKI_CONTROLLER_BUTTON_DPAD_RIGHT;
                              else if(action == "CROSS" || action == "JUMP") button = CHIAKI_CONTROLLER_BUTTON_CROSS;
                              else if(action == "CIRCLE" || action == "SNEAK") button = CHIAKI_CONTROLLER_BUTTON_MOON;
                              else if(action == "SQUARE" || action == "CRAFT") button = CHIAKI_CONTROLLER_BUTTON_BOX;
                              else if(action == "TRIANGLE" || action == "INVENTORY") button = CHIAKI_CONTROLLER_BUTTON_PYRAMID;
                              else if(action == "L1" || action == "HOTBAR_PREV") button = CHIAKI_CONTROLLER_BUTTON_L1;
                              else if(action == "R1" || action == "HOTBAR_NEXT") button = CHIAKI_CONTROLLER_BUTTON_R1;
                              else if(action == "L3" || action == "SPRINT") button = CHIAKI_CONTROLLER_BUTTON_L3;
                              else if(action == "R3" || action == "FLY_DOWN_SLOW") button = CHIAKI_CONTROLLER_BUTTON_R3;
                              else if(action == "OPTIONS" || action == "PAUSE") button = CHIAKI_CONTROLLER_BUTTON_OPTIONS;
                              else if(action == "SHARE") button = CHIAKI_CONTROLLER_BUTTON_SHARE;
                              else if(action == "TOUCHPAD" || action == "SOCIAL") button = CHIAKI_CONTROLLER_BUTTON_TOUCHPAD;

                              bool is_analog = false;
                              bool duration_valid = true;
                              int duration_ms = 150; // Backwards-compatible default.
                              ChiakiControllerState next;
                              chiaki_controller_state_set_idle(&next);
                              if(action == "L2" || action == "PLACE" || action == "USE")
                              {
                                  next.l2_state = 255;
                                  is_analog = true;
                              }
                              else if(action == "R2" || action == "BREAK" || action == "ATTACK")
                              {
                                  next.r2_state = 255;
                                  is_analog = true;
                              }

                              // All digital buttons and triggers accept optional milliseconds:
                              // CROSS 25, RIGHT 100, L2 50, etc. One-word commands retain 150ms.
                              if(parts.size() == 2 && action != "MOVE" && action != "LOOK")
                              {
                                  bool parsed = false;
                                  duration_ms = parts.at(1).toInt(&parsed);
                                  duration_valid = parsed && duration_ms > 0;
                              }
                              else if(parts.size() == 3 && (action == "MOVE" || action == "LOOK"))
                              {
                                  bool parsed = false;
                                  duration_ms = parts.at(2).toInt(&parsed);
                                  duration_valid = parsed && duration_ms > 0;
                                  const QByteArray direction = parts.at(1);
                                  const int16_t stick = 22000;
                                  const int16_t diagonal = 15556;
                                  if(action == "MOVE")
                                  {
                                      if(direction == "FORWARD") { next.left_y = -stick; is_analog = true; }
                                      else if(direction == "BACK") { next.left_y = stick; is_analog = true; }
                                      else if(direction == "LEFT") { next.left_x = -stick; is_analog = true; }
                                      else if(direction == "RIGHT") { next.left_x = stick; is_analog = true; }
                                      else if(direction == "FORWARD-LEFT") { next.left_y = -diagonal; next.left_x = -diagonal; is_analog = true; }
                                      else if(direction == "FORWARD-RIGHT") { next.left_y = -diagonal; next.left_x = diagonal; is_analog = true; }
                                      else if(direction == "BACK-LEFT") { next.left_y = diagonal; next.left_x = -diagonal; is_analog = true; }
                                      else if(direction == "BACK-RIGHT") { next.left_y = diagonal; next.left_x = diagonal; is_analog = true; }
                                  }
                                  else
                                  {
                                      if(direction == "UP") { next.right_y = -stick; is_analog = true; }
                                      else if(direction == "DOWN") { next.right_y = stick; is_analog = true; }
                                      else if(direction == "LEFT") { next.right_x = -stick; is_analog = true; }
                                      else if(direction == "RIGHT") { next.right_x = stick; is_analog = true; }
                                  }
                              }
                              else if(parts.size() != 1)
                                  duration_valid = false;

                              if(button == 0 && !is_analog)
                                  client->write("ERR unknown command\n");
                              else if(!duration_valid)
                                  client->write("ERR duration must be a positive integer in milliseconds\n");
                              else if(!connected)
                                  client->write("ERR not connected\n");
                              else if(ug79_pulse_timer->isActive())
                                  client->write("ERR busy\n");
                              else
                              {
                                  ug79_automation_state = next;
                                  ug79_automation_state.buttons = button;
                                  SendFeedbackState();
                                  ug79_pulse_timer->start(duration_ms);
                                  client->write("OK ");
                                  client->write(command);
                                  client->write(QByteArray(" ") + QByteArray::number(duration_ms) + "ms\n");
                              }
                          }
                          client->disconnectFromHost();
                      });
                  }
              });
              if(ug79_server->listen(QHostAddress::LocalHost, 39777))
                  qInfo() << "Controller probe listening on 127.0.0.1:39777";
              else
                  qWarning() << "Controller probe unavailable:" << ug79_server->errorString();

          '''

          cpp = change(
              cpp,
              '\tStartAudioOutDrainThread();\n}',
              '\tStartAudioOutDrainThread();\n' + server_code + '}',
              1, 'StreamSession constructor tail',
          )
          cmake = change(
              cmake,
              'find_package(Qt6 REQUIRED COMPONENTS Core Gui Concurrent Svg Qml Quick Widgets)',
              'find_package(Qt6 REQUIRED COMPONENTS Core Gui Concurrent Svg Qml Quick Widgets Network)',
              1, 'Qt package selection',
          )
          cmake = change(
              cmake,
              'target_link_libraries(chiaki Qt::Core Qt::Gui',
              'target_link_libraries(chiaki Qt::Network Qt::Core Qt::Gui',
              1, 'Qt Network linkage',
          )
          # Colour conversion for on-demand decoded-frame snapshots.
          cmake += '\n# Build 7: decoded-frame RGB conversion for keyboard calibration\n'
          cmake += 'find_package(PkgConfig REQUIRED)\n'
          cmake += 'pkg_check_modules(UG79_SWSCALE REQUIRED IMPORTED_TARGET libswscale)\n'
          cmake += 'target_link_libraries(chiaki PkgConfig::UG79_SWSCALE)\n'

          # Video is captured from the decoded AVFrame only on explicit FRAME request.
          backend_path = Path('gui/src/qmlbackend.cpp')
          backend = backend_path.read_text(encoding='utf-8')
          backend = change(
              backend,
              '#include <QImageReader>',
              '#include <QImageReader>\n#include <QDir>\n#include <QDateTime>\n#include <QStandardPaths>\n#include <QFile>\n#include <algorithm>',
              1, 'capture Qt includes',
          )
          backend = change(
              backend,
              '#include <libavutil/pixfmt.h>',
              '#include <libavutil/pixfmt.h>\n#include <libswscale/swscale.h>\n#include <libavutil/hwcontext.h>',
              1, 'capture FFmpeg includes',
          )
          image_capture = r'''// Build 7: capture a real decoded video frame only when requested.
          // Never capture continuously or upload images; user-labelled local evidence.
          static QString Ug79SaveCalibrationFrame(AVFrame *frame, const QString &label)
          {
              if(!frame || frame->width <= 0 || frame->height <= 0)
                  return QStringLiteral("ERR invalid decoder frame");
              AVFrame *cpu = nullptr;
              AVFrame *src = frame;
              if(frame->hw_frames_ctx)
              {
                  cpu = av_frame_alloc();
                  if(!cpu || av_hwframe_transfer_data(cpu, frame, 0) < 0)
                  {
                      av_frame_free(&cpu);
                      return QStringLiteral("ERR hardware frame transfer failed");
                  }
                  src = cpu;
              }
              if(!src->data[0])
              {
                  av_frame_free(&cpu);
                  return QStringLiteral("ERR frame has no readable planes");
              }
              const int width = std::min(src->width, 1280);
              const int height = std::max(1, (src->height * width) / src->width);
              QImage img(width, height, QImage::Format_RGB888);
              if(img.isNull())
              {
                  av_frame_free(&cpu);
                  return QStringLiteral("ERR image allocation failed");
              }
              SwsContext *ctx = sws_getContext(src->width, src->height,
                  static_cast<AVPixelFormat>(src->format), width, height,
                  AV_PIX_FMT_RGB24, SWS_BILINEAR, nullptr, nullptr, nullptr);
              if(!ctx)
              {
                  av_frame_free(&cpu);
                  return QStringLiteral("ERR unsupported pixel format");
              }
              uint8_t *dst[4] = {img.bits(), nullptr, nullptr, nullptr};
              int dstStride[4] = {static_cast<int>(img.bytesPerLine()), 0, 0, 0};
              const int converted = sws_scale(ctx, src->data, src->linesize, 0, src->height, dst, dstStride);
              sws_freeContext(ctx);
              av_frame_free(&cpu);
              if(converted != height)
                  return QStringLiteral("ERR incomplete frame conversion");
              const QString base = QStandardPaths::writableLocation(QStandardPaths::AppDataLocation);
              if(base.isEmpty())
                  return QStringLiteral("ERR application data directory unavailable");
              QDir dir(base);
              if(!dir.mkpath(QStringLiteral("keyboard-calibration")) ||
                 !dir.cd(QStringLiteral("keyboard-calibration")))
                  return QStringLiteral("ERR cannot create calibration directory");
              const QString now = QDateTime::currentDateTime().toString(QStringLiteral("yyyyMMdd_HHmmss_zzz"));
              const QString filename = QStringLiteral("%1_%2.png").arg(label, now);
              const QString target = dir.filePath(filename);
              if(!img.save(target, "PNG"))
                  return QStringLiteral("ERR cannot save PNG");
              QFile ledger(dir.filePath(QStringLiteral("samples.csv")));
              if(ledger.open(QIODevice::WriteOnly | QIODevice::Append | QIODevice::Text))
              {
                  if(ledger.size() == 0)
                      ledger.write("timestamp,label,filename,width,height\n");
                  ledger.write(QStringLiteral("%1,%2,%3,%4,%5\n")
                       .arg(now, label, filename)
                       .arg(width).arg(height).toUtf8());
                  ledger.close();
              }
              return QStringLiteral("SAVED ") + target;
          }

          '''
          backend = change(
              backend,
              'static bool detailedVerboseTelemetryEnabled()',
              image_capture + 'static bool detailedVerboseTelemetryEnabled()',
              1, 'on-demand decoded frame helper',
          )
          backend = change(
              backend,
              '        const qint64 prepare_end_us = static_cast<qint64>(chiaki_time_now_monotonic_us());',
              '        QString ug79_capture_label;\n'
              '        if(session->TakeCalibrationFrameRequest(&ug79_capture_label)) {\n'
              '            const QString capture_result = Ug79SaveCalibrationFrame(frame.frame, ug79_capture_label);\n'
              '            session->SetCalibrationFrameResult(capture_result);\n'
              '            qCInfo(chiakiGui) << "Keyboard calibration frame:" << capture_result;\n'
              '        }\n'
              '        const qint64 prepare_end_us = static_cast<qint64>(chiaki_time_now_monotonic_us());',
              1, 'on-demand frame interception',
          )
          backend_path.write_text(backend, encoding='utf-8')
          cpp_path.write_text(cpp, encoding='utf-8')
          hpp_path.write_text(hpp, encoding='utf-8')
          cmake_path.write_text(cmake, encoding='utf-8')
          print('UG79 touchpad + decoded-video keyboard calibration v7 injected into temporary build checkout.')
          PY

      - name: Inject opt-in PSN keyboard diagnostics (temporary checkout only)
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/src/ctrl.c')
          s = path.read_text(encoding='utf-8')

          def patch(before, after, description):
              global s
              matches = s.count(before)
              if matches != 1:
                  raise RuntimeError(f'KBPROBE {description}: expected one matching source fragment, found {matches}; refusing to build changed source')
              s = s.replace(before, after, 1)
              print('KBPROBE: verified and applied', description)

          # Add a dedicated privacy-safe log: no packet payloads, keys, PSN IDs, or gameplay text.
          patch('#include <stdio.h>\n', '#include <stdio.h>\n#include <time.h>\n', 'time include')
          patch('static void ctrl_failed(ChiakiCtrl *ctrl, ChiakiQuitReason reason)\n{',
          '''static void kbprobe_event(const char *message)
          {
              const char *filename = getenv("CHIAKI_KB_DIAG_LOG");
              if(!filename || !filename[0])
                  return;
              FILE *out = fopen(filename, "a");
              if(!out)
                  return;
              fprintf(out, "%lld %s\\n", (long long)time(NULL), message);
              fclose(out);
          }

          static void ctrl_failed(ChiakiCtrl *ctrl, ChiakiQuitReason reason)
          {
              kbprobe_event("CTRL_FAILED");''', 'private diagnostic logger')
          patch('CHIAKI_LOGI(ctrl->session->log, "Ctrl connected");',
                'CHIAKI_LOGI(ctrl->session->log, "Ctrl connected");\n\tkbprobe_event("CTRL_CONNECTED");', 'control channel connected')
          patch('case CTRL_MESSAGE_TYPE_SESSION_ID:\n\t\t\tctrl_message_received_session_id(ctrl, payload, payload_size);',
                'case CTRL_MESSAGE_TYPE_SESSION_ID:\n\t\t\tkbprobe_event("SESSION_ID_MESSAGE_RECEIVED");\n\t\t\tctrl_message_received_session_id(ctrl, payload, payload_size);', 'session-ID milestone')
          patch('static void ctrl_message_received_switch_to_stream_connection(ChiakiCtrl *ctrl, uint8_t *payload, size_t payload_size)\n{',
                'static void ctrl_message_received_switch_to_stream_connection(ChiakiCtrl *ctrl, uint8_t *payload, size_t payload_size)\n{\n\tkbprobe_event("STREAM_SWITCH_ACK_RECEIVED");', 'stream switch ack')
