                  }
                  case CHIAKI_EVENT_KEYBOARD_TEXT_CHANGE: {
                      // A PS4 text-response event is not necessarily proof of insertion.
                      ug79KbV2Log("KB_V2_TEXT_RESPONSE_EVENT");
                      QMetaObject::invokeMethod(this, [this]() {
                          if(ug79_native_kb_dialog)
                          {
                              auto *status = ug79_native_kb_dialog->findChild<QLabel *>(
                                  QStringLiteral("ug79_kb_status"));
                              if(status)
                                  status->setText(QStringLiteral("PS4 sent a native text-response event. Check its screen."));
                          }
                      }, Qt::QueuedConnection);
