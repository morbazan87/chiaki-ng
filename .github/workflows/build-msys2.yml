                  case CHIAKI_EVENT_KEYBOARD_REMOTE_CLOSE:
                      ug79KbV2Log("KB_V2_REMOTE_CLOSE_EVENT");
                      QMetaObject::invokeMethod(this, [this]() {
                          if(ug79_native_kb_dialog)
                              ug79_native_kb_dialog->deleteLater(); // Do not accidentally send Cancel.
                      }, Qt::QueuedConnection);
                      break;
          '''
          cpp = change(cpp, '\t\tcase CHIAKI_EVENT_REGIST:', cases + '\t\tcase CHIAKI_EVENT_REGIST:',
              'native keyboard open, text response and close UI')
          cpp = change(cpp, '\t\t\tconnected = false;',
              '''            QMetaObject::invokeMethod(this, [this]() {
                          if(ug79_native_kb_dialog)
                              ug79_native_kb_dialog->deleteLater();
                      }, Qt::QueuedConnection);
          \t\t\tconnected = false;''',
