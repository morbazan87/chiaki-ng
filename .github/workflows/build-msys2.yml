                                  return;
                              }
                              ug79KbV2Log("KB_V2_TEXT_SEND_BEGIN");
                              const ChiakiErrorCode err = chiaki_session_keyboard_set_text(&session, bytes.constData());
                              if(err == CHIAKI_ERR_SUCCESS)
                              {
                                  ug79KbV2Log("KB_V2_TEXT_SENT_TO_TRANSPORT");
                                  status->setText(QStringLiteral("Text submitted to transport. Check Minecraft, then Accept / Done."));
                                  acceptButton->setEnabled(true);
                              }
                              else
                              {
                                  ug79KbV2Log("KB_V2_TEXT_SEND_ERROR");
