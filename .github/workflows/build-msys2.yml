      - name: Inject opt-in bounded native keyboard batch automation v3 (temporary checkout)
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          # Opt-in queued Minecraft command automation atop Build #7 + Native Keyboard v2.
          # Patch order: controller v7, KBPROBE v1, native keyboard v2, THIS patch.
          # Only changes GitHub Actions temporary checkout.
          from pathlib import Path
          import re

          cpp_path = Path('gui/src/streamsession.cpp')
          header_path = Path('gui/include/streamsession.h')
          cpp = cpp_path.read_text(encoding='utf-8')
          hpp = header_path.read_text(encoding='utf-8')

          def replace_once(src, old, new, label):
              count = src.count(old)
              if count == 1:
                  print('NativeKB v3 exact source verified:', label)
                  return src.replace(old, new, 1)
              if count != 0:
                  raise RuntimeError(f'NativeKB v3 {label}: ambiguous exact anchor, found {count}')
              # v2 inserts raw C++ into a YAML Python block: YAML strips a common indent.
              # Accept ONLY a unique match with the same complete non-whitespace source lines.
              parts = old.splitlines(keepends=True)
              expression = ''
              for part in parts:
                  has_newline = part.endswith('\n')
                  content = part.rstrip('\r\n').strip()
                  if not content:
                      expression += r'^[ \t]*' + ('\n' if has_newline else '')
                  else:
                      expression += r'^[ \t]*' + re.escape(content) + ('\n' if has_newline else '')
              matches = list(re.finditer(expression, src, re.MULTILINE))
              if len(matches) != 1:
                  raise RuntimeError(f'NativeKB v3 {label}: expected 1 whitespace-normalized source anchor, found {len(matches)}')
              m = matches[0]
              print('NativeKB v3 indentation-normalized source verified:', label)
              return src[:m.start()] + new + src[m.end():]

          hpp = replace_once(hpp, '#include <QDialog>',
              '#include <QDialog>\n#include <QLabel>\n#include <QStringList>', 'header Qt includes')
          hpp = replace_once(hpp, 'QPointer<QDialog> ug79_native_kb_dialog;', '''QPointer<QDialog> ug79_native_kb_dialog;
          		// v3 bounded queue; state lives across PS4 keyboard open/close cycles.
          		QPointer<QLabel> ug79_batch_status;
          		QStringList ug79_batch_commands;
          		int ug79_batch_index = 0;
          		int ug79_batch_phase = 0; // 0 idle, 1 open, 2 reply, 3 close, 4 accept pending, 5 next-cycle delay
          		bool ug79_batch_active = false;
          		bool ug79_batch_keyboard_open = false;
          		quint64 ug79_batch_stage_token = 0;''', 'queue state')
          hpp = replace_once(hpp, 'void Event(ChiakiEvent *event);', '''void Ug79BatchStop(const QString &reason);
          		void Ug79BatchSetPhase(int phase, int timeout_ms);
          		void Ug79BatchSendCurrent();
          		void Ug79BatchOnReply(const QString &text);
          		void Ug79BatchOnClose();
          		void Ug79BatchReopen();
          		void Event(ChiakiEvent *event);''', 'batch method declarations')
          cpp = replace_once(cpp, '#include <QPointer>',
              '#include <QPointer>\n#include <QPlainTextEdit>\n#include <QSpinBox>\n#include <QStringList>', 'GUI batch includes')

          methods = r'''// Native keyboard v3: bounded, stop-on-error queued text entry. GUI thread only.
          void StreamSession::Ug79BatchStop(const QString &reason)
          {
              ++ug79_batch_stage_token; // Invalidate outstanding timeouts and controller pulses.
              const bool was_active = ug79_batch_active;
              ug79_batch_active = false;
              ug79_batch_phase = 0;
              chiaki_controller_state_set_idle(&ug79_automation_state);
              if(connected)
                  SendFeedbackState();
              if(ug79_batch_status)
                  ug79_batch_status->setText(reason);
              if(was_active)
                  ug79KbV2Log("KB_V3_BATCH_STOPPED");
          }

          void StreamSession::Ug79BatchSetPhase(int phase, int timeout_ms)
          {
              ug79_batch_phase = phase;
              const quint64 stage = ++ug79_batch_stage_token;
              if(timeout_ms > 0)
                  QTimer::singleShot(timeout_ms, this, [this, stage, phase]() {
                      if(ug79_batch_active && ug79_batch_stage_token == stage && ug79_batch_phase == phase)
                      {
                          ug79KbV2Log("KB_V3_STAGE_TIMEOUT");
                          Ug79BatchStop(QStringLiteral("Stopped: PS4 keyboard response timed out. Check game state before retrying."));
                      }
                  });
          }

          void StreamSession::Ug79BatchSendCurrent()
          {
              if(!ug79_batch_active || !connected || !ug79_batch_keyboard_open ||
                 ug79_batch_phase != 1 || ug79_batch_index >= ug79_batch_commands.size())
                  return;
              const QString command = ug79_batch_commands.at(ug79_batch_index);
              const QByteArray bytes = command.toUtf8();
              if(bytes.isEmpty() || bytes.size() > 80)
              {
                  Ug79BatchStop(QStringLiteral("Stopped: invalid command length."));
                  return;
              }
              if(ug79_batch_status)
                  ug79_batch_status->setText(QStringLiteral("Sending %1 of %2; awaiting PS4 text response...")
                      .arg(ug79_batch_index + 1).arg(ug79_batch_commands.size()));
              Ug79BatchSetPhase(2, 6000); // Arm before sending: response may be very quick.
              ug79KbV2Log("KB_V3_TEXT_SEND_BEGIN");
              const ChiakiErrorCode err = chiaki_session_keyboard_set_text(&session, bytes.constData());
              if(err != CHIAKI_ERR_SUCCESS)
              {
                  ug79KbV2Log("KB_V3_TEXT_SEND_FAILED");
                  Ug79BatchStop(QStringLiteral("Stopped: text transport rejected request. Error %1.").arg((int)err));
                  return;
              }
              ug79KbV2Log("KB_V3_TEXT_SUBMITTED");
          }

          void StreamSession::Ug79BatchOnReply(const QString &text)
          {
              if(!ug79_batch_active || ug79_batch_phase != 2)
                  return;
              if(!text.isEmpty() && text != ug79_batch_commands.at(ug79_batch_index))
              {
                  ug79KbV2Log("KB_V3_TEXT_RESPONSE_MISMATCH");
                  Ug79BatchStop(QStringLiteral("Stopped: PS4 returned different text. No automatic Accept sent."));
                  return;
              }
              ug79KbV2Log(text.isEmpty() ? "KB_V3_TEXT_RESPONSE_EMPTY" : "KB_V3_TEXT_RESPONSE_MATCHED");
              Ug79BatchSetPhase(4, 0);
              const quint64 stage = ug79_batch_stage_token;
              QTimer::singleShot(160, this, [this, stage]() {
                  if(!connected || !ug79_batch_active || ug79_batch_phase != 4 || ug79_batch_stage_token != stage)
                      return;
                  Ug79BatchSetPhase(3, 6000);
                  ug79KbV2Log("KB_V3_ACCEPT_BEGIN");
                  const ChiakiErrorCode err = chiaki_session_keyboard_accept(&session);
                  if(err != CHIAKI_ERR_SUCCESS)
                  {
                      ug79KbV2Log("KB_V3_ACCEPT_FAILED");
                      Ug79BatchStop(QStringLiteral("Stopped: Accept transport error %1.").arg((int)err));
                  }
                  else
                      ug79KbV2Log("KB_V3_ACCEPT_SUBMITTED");
              });
          }

          void StreamSession::Ug79BatchOnClose()
          {
              ug79_batch_keyboard_open = false;
              if(!ug79_batch_active)
                  return;
              if(ug79_batch_phase != 3)
              {
                  Ug79BatchStop(QStringLiteral("Stopped: PS4 keyboard closed unexpectedly."));
                  return;
              }
              ++ug79_batch_index;
              ug79KbV2Log("KB_V3_COMMAND_CLOSED");
              if(ug79_batch_index >= ug79_batch_commands.size())
              {
                  ug79KbV2Log("KB_V3_BATCH_COMPLETED_PROTOCOL");
                  Ug79BatchStop(QStringLiteral("Queue complete: PS4 closed the keyboard for every command. Verify Minecraft results."));
                  // Completion is protocol-level, not confirmation that Minecraft executed every command.
                  return;
              }
              if(ug79_batch_status)
                  ug79_batch_status->setText(QStringLiteral("Completed %1 of %2. Reopening Minecraft chat...")
                      .arg(ug79_batch_index).arg(ug79_batch_commands.size()));
              Ug79BatchSetPhase(5, 0);
              const quint64 stage = ug79_batch_stage_token;
              QTimer::singleShot(850, this, [this, stage]() {
                  if(ug79_batch_active && ug79_batch_phase == 5 && ug79_batch_stage_token == stage)
                      Ug79BatchReopen();
              });
          }

          void StreamSession::Ug79BatchReopen()
          {
              if(!ug79_batch_active || !connected || ug79_batch_phase != 5)
                  return;
              Ug79BatchSetPhase(1, 9500);
              const quint64 stage = ug79_batch_stage_token;
              ug79KbV2Log("KB_V3_REOPEN_CHAT_BEGIN");
              // Minecraft Bedrock PS4: D-pad Right opens chat, Cross selects the text input.
              // Short pulses, explicit releases. No second blind Cross: timeout instead.
              chiaki_controller_state_set_idle(&ug79_automation_state);
