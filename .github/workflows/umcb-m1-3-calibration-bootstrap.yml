# UMCB M1.3 one-time source installer. Do not leave this in release builds.
# Create umcb/m1-3-supervised-calibration from observer SHA 527f66af151c426027dcf98c58dd6d5f5abc180c.
name: UMCB M1.3 One-Time Supervised Calibration Setup
on:
  push:
    branches:
      - umcb/m1-3-supervised-calibration
permissions:
  contents: write
jobs:
  install-calibration:
    if: github.ref == 'refs/heads/umcb/m1-3-supervised-calibration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Check exact observer parent and file hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '527f66af151c426027dcf98c58dd6d5f5abc180c' || { echo 'ABORT: branch must be based on current observer'; exit 1; }
          test "$(git hash-object gui/CMakeLists.txt)" = "aa92d0ae8fed1b51a58b2dd7b622158ff2c2a2a6" || { echo "ABORT: base file mismatch: gui/CMakeLists.txt"; exit 1; }
          test "$(git hash-object gui/include/qmlbackend.h)" = "e4c2034e69c9b903d6663ebeab9bcdc13f8c4ba8" || { echo "ABORT: base file mismatch: gui/include/qmlbackend.h"; exit 1; }
          test "$(git hash-object gui/src/qmlbackend.cpp)" = "fe0d390b9421840bc845ec8f90892a5b47dca73c" || { echo "ABORT: base file mismatch: gui/src/qmlbackend.cpp"; exit 1; }
          test -z "$(git status --porcelain)" || { echo 'ABORT: working tree not clean'; exit 1; }
      - name: Install bounded source changes once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          
          from pathlib import Path
          import base64, gzip
          
          def one(filename, old, new):
              p=Path(filename)
              t=p.read_text(encoding='utf-8')
              n=t.count(old)
              if n != 1:
                  raise SystemExit('UMCB M1.3: exact source anchor failed in '+filename+': '+str(n))
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          
          one('gui/CMakeLists.txt',
              'find_package(Qt6 REQUIRED COMPONENTS Core Gui Concurrent Svg Qml Quick Widgets)',
              'find_package(Qt6 REQUIRED COMPONENTS Core Gui Concurrent Svg Qml Quick Widgets Network)')
          one('gui/CMakeLists.txt',
              '\tinclude/umcbframeobserver.h\n\tsrc/umcbframeobserver.cpp\n',
              '\tinclude/umcbframeobserver.h\n\tsrc/umcbframeobserver.cpp\n\tinclude/umcbcalibrationcapture.h\n\tsrc/umcbcalibrationcapture.cpp\n')
          one('gui/CMakeLists.txt',
              'Qt::Concurrent Qt::Svg Qt::Qml Qt::Quick Qt::Widgets)',
              'Qt::Concurrent Qt::Svg Qt::Qml Qt::Quick Qt::Widgets Qt::Network)')
          
          one('gui/include/qmlbackend.h',
              'class UMCBFrameObserver;\n',
              'class UMCBFrameObserver;\nclass UMCBCalibrationCapture;\n')
          one('gui/include/qmlbackend.h',
              '    std::unique_ptr<UMCBFrameObserver> umcb_frame_observer;\n',
              '    std::unique_ptr<UMCBFrameObserver> umcb_frame_observer;\n'
              '    std::unique_ptr<UMCBCalibrationCapture> umcb_calibration_capture;\n')
          
          one('gui/src/qmlbackend.cpp',
              '#include "umcbframeobserver.h"\n',
              '#include "umcbframeobserver.h"\n#include "umcbcalibrationcapture.h"\n')
          one('gui/src/qmlbackend.cpp',
              '#include <QTimer>\n',
              '#include <QTimer>\n#ifdef Q_OS_WIN\n#include <QLocalServer>\n#include <QLocalSocket>\n#include <QCoreApplication>\n#endif\n')
          one('gui/src/qmlbackend.cpp',
              '    if (qEnvironmentVariableIntValue("UMCB_FRAME_OBSERVER") == 1)\n'
              '        umcb_frame_observer = std::make_unique<UMCBFrameObserver>();\n',
              '    if (qEnvironmentVariableIntValue("UMCB_FRAME_OBSERVER") == 1)\n'
              '        umcb_frame_observer = std::make_unique<UMCBFrameObserver>();\n'
              """#ifdef Q_OS_WIN
              if (qEnvironmentVariableIntValue("UMCB_CALIBRATION") == 1) {
                  umcb_calibration_capture = std::make_unique<UMCBCalibrationCapture>();
                  auto *server = new QLocalServer(this);
                  server->setSocketOptions(QLocalServer::UserAccessOption);
                  const QString pipeName = QStringLiteral("UMCB_CAL_%1").arg(QCoreApplication::applicationPid());
                  if (server->listen(pipeName)) {
                      qInfo().noquote() << "[UMCB-M1.3] Calibration local pipe" << pipeName;
                      connect(server, &QLocalServer::newConnection, this, [this, server] {
                          while (auto *socket = server->nextPendingConnection()) {
                              connect(socket, &QLocalSocket::disconnected, socket, &QObject::deleteLater);
                              connect(socket, &QLocalSocket::readyRead, this, [this, socket] {
                                  QByteArray data = socket->property("umcbRequest").toByteArray() + socket->readAll();
                                  if (data.size() > 96) {
                                      socket->write("ERROR request_too_long\\n");
                                      socket->disconnectFromServer();
                                      return;
                                  }
                                  if (!data.contains('\\n')) {
                                      socket->setProperty("umcbRequest", data);
                                      return;
                                  }
                                  const QString cmd = QString::fromUtf8(data.left(data.indexOf('\\n'))).trimmed();
                                  QString reply;
                                  if (cmd == "STATUS")
                                      reply = umcb_calibration_capture->status();
                                  else if (cmd.startsWith("CAPTURE "))
                                      reply = umcb_calibration_capture->request(cmd.mid(8));
                                  else
                                      reply = "ERROR unknown_command";
                                  socket->write((reply + "\\n").toUtf8());
                                  socket->flush();
                                  socket->disconnectFromServer();
                              });
                          }
                      });
                      auto *watchdog = new QTimer(this);
                      watchdog->setInterval(1000);
                      connect(watchdog, &QTimer::timeout, this, [this] {
                          umcb_calibration_capture->expireStalled();
                      });
                      watchdog->start();
                  } else {
                      qWarning() << "[UMCB-M1.3] Could not open local calibration pipe:" << server->errorString();
                      umcb_calibration_capture.reset();
                  }
              }
          #endif
          """)
          one('gui/src/qmlbackend.cpp',
              '    umcb_frame_observer.reset();\n    frame_thread->parent()->deleteLater();',
              '    umcb_frame_observer.reset();\n'
              '    umcb_calibration_capture.reset();\n'
              '    frame_thread->parent()->deleteLater();')
          one('gui/src/qmlbackend.cpp',
              '        if (umcb_frame_observer && !frame.recovered)\n'
              '            umcb_frame_observer->sample(frame.frame);\n',
              '        if (umcb_frame_observer && !frame.recovered)\n'
              '            umcb_frame_observer->sample(frame.frame);\n'
              '        if (umcb_calibration_capture && !frame.recovered)\n'
              '            umcb_calibration_capture->observe(frame.frame);\n')
          one('gui/src/qmlbackend.cpp',
              '        if (umcb_frame_observer)\n'
              '            umcb_frame_observer->clearPending();\n',
              '        if (umcb_frame_observer)\n'
              '            umcb_frame_observer->clearPending();\n'
              '        if (umcb_calibration_capture)\n'
              '            umcb_calibration_capture->cancelSession();\n')
          one('gui/src/qmlbackend.cpp',
              '    qCInfo(chiakiGui) << "[UMCB-M1.1] session_observer_enabled="\n',
              '    qCInfo(chiakiGui) << "[UMCB-M1.3] calibration_enabled="\n'
              '                      << (umcb_calibration_capture ? 1 : 0);\n'
              '    qCInfo(chiakiGui) << "[UMCB-M1.1] session_observer_enabled="\n')
          
          payloads = {
              'gui/include/umcbcalibrationcapture.h': '',
              'gui/src/umcbcalibrationcapture.cpp': '',
              'tools/UMCB-Calibrate.ps1': '',
          }
          
          for filename, encoded in payloads.items():
              p=Path(filename)
              if p.exists():
                  raise SystemExit('UMCB M1.3 ABORT: new source file already exists '+filename)
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(gzip.decompress(base64.b64decode(encoded)))
          print('UMCB M1.3: installed ordinary calibration source and optional Windows panel')
          
          PYCODE
          git diff --check
          test "$(git status --porcelain --untracked-files=all | sed 's/^...//' | sort)" = "$(printf '%s\n' 'gui/CMakeLists.txt' 'gui/include/qmlbackend.h' 'gui/include/umcbcalibrationcapture.h' 'gui/src/qmlbackend.cpp' 'gui/src/umcbcalibrationcapture.cpp' 'tools/UMCB-Calibrate.ps1' | sort)" || { echo 'ABORT: unexpected changed paths'; git status --short; exit 1; }
      - name: Commit ordinary source, remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'gui/CMakeLists.txt' 'gui/include/qmlbackend.h' 'gui/include/umcbcalibrationcapture.h' 'gui/src/qmlbackend.cpp' 'gui/src/umcbcalibrationcapture.cpp' 'tools/UMCB-Calibrate.ps1'
          git rm .github/workflows/umcb-m1-3-calibration-bootstrap.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' .github/workflows/umcb-m1-3-calibration-bootstrap.yml 'gui/CMakeLists.txt' 'gui/include/qmlbackend.h' 'gui/include/umcbcalibrationcapture.h' 'gui/src/qmlbackend.cpp' 'gui/src/umcbcalibrationcapture.cpp' 'tools/UMCB-Calibrate.ps1' | sort)" || { echo 'ABORT: unexpected staged paths'; exit 1; }
          git commit -m 'UMCB M1.3: supervised labelled PS4-frame calibration [skip ci]'
          git push origin HEAD:umcb/m1-3-supervised-calibration
